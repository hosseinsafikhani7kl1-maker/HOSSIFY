<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091424" />
      <stop offset="50%" stop-color="#060c18" />
      <stop offset="100%" stop-color="#02060d" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132035" />
      <stop offset="100%" stop-color="#0b1322" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect width="360" height="760" rx="36" fill="url(#bgGrad3)" stroke="#1e293b" stroke-width="3" />

  <!-- Status Bar -->
  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    <text x="24" y="28" font-weight="bold">11:25</text>
    <text x="336" y="28" text-anchor="end">4G 99%</text>
  </g>

  <!-- Header -->
  <g transform="translate(20, 42)">
    <text x="0" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="15">ماشین‌حساب برش و تله‌متری (HUD)</text>
    <rect x="240" y="4" width="80" height="28" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="280" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Tripping IN</text>
  </g>

  <!-- Live Operation Telemetry HUD -->
  <g transform="translate(20, 80)">
    <rect width="320" height="180" rx="16" fill="url(#cardGrad3)" stroke="#38bdf8" stroke-width="1.2" />
    
    <g transform="translate(16, 16)">
      <text x="0" y="14" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">پایش زنده دکل لوله‌مغزی (Realtime Telemetry)</text>
      
      <!-- 4 Dashboard Tiles -->
      <!-- Tile 1: Running Speed -->
      <g transform="translate(0, 30)">
        <rect width="138" height="52" rx="8" fill="#07111e" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="18" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">سرعت حرکت (RIH Speed)</text>
        <text x="10" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="900" font-size="16">65 <tspan font-size="10" fill="#94a3b8">ft/min</tspan></text>
      </g>

      <!-- Tile 2: Wellhead Pressure -->
      <g transform="translate(150, 30)">
        <rect width="138" height="52" rx="8" fill="#07111e" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="18" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">فشار سرچاه (WHP)</text>
        <text x="10" y="40" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="900" font-size="16">3,200 <tspan font-size="10" fill="#94a3b8">psi</tspan></text>
      </g>

      <!-- Tile 3: Tension / Overpull -->
      <g transform="translate(0, 90)">
        <rect width="138" height="52" rx="8" fill="#07111e" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="18" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">کشش سر لوله (Hook Load)</text>
        <text x="10" y="40" fill="#10b981" font-family="system-ui, sans-serif" font-weight="900" font-size="16">18,400 <tspan font-size="10" fill="#94a3b8">lbs</tspan></text>
      </g>

      <!-- Tile 4: Pump Differential -->
      <g transform="translate(150, 90)">
        <rect width="138" height="52" rx="8" fill="#07111e" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="18" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">فشار داخل لوله (Circ. P)</text>
        <text x="10" y="40" fill="#ef4444" font-family="system-ui, sans-serif" font-weight="900" font-size="16">4,850 <tspan font-size="10" fill="#94a3b8">psi</tspan></text>
      </g>
    </g>
  </g>

  <!-- Cutoff Optimization Card -->
  <g transform="translate(20, 275)">
    <rect width="320" height="235" rx="16" fill="url(#cardGrad3)" stroke="#10b981" stroke-width="1.2" />
    
    <g transform="translate(16, 16)">
      <text x="0" y="14" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">ماشین‌حساب برش بهینه انتهای لوله (Cutoff Optimization)</text>

      <g transform="translate(0, 30)">
        <rect width="288" height="42" rx="8" fill="#091424" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">طول کل رشته لوله‌مغزی</text>
        <text x="12" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">15,000 ft (4,572 m)</text>
      </g>

      <g transform="translate(0, 80)">
        <rect width="288" height="42" rx="8" fill="#091424" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">طول برش پیشنهادی الگوریتم</text>
        <text x="12" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">150 ft (45.7 m) - تمدید عمر ۳۵٪</text>
      </g>

      <g transform="translate(0, 130)">
        <rect width="288" height="58" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
        <text x="12" y="20" fill="#34d399" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">نتیجه بازتوزیع تنش:</text>
        <text x="12" y="36" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="9.5">نقاط اوج خستگی روی قرقره و گوسنک جابجا شده و نرخ آسیب به ۳۲٪ کاهش می‌یابد.</text>
      </g>
    </g>
  </g>

  <!-- Action Button -->
  <g transform="translate(20, 525)">
    <rect width="320" height="50" rx="14" fill="url(#cyanGrad)" />
    <text x="160" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">شروع شبیه‌سازی ورود به چاه (RIH) ←</text>
  </g>
</svg>
