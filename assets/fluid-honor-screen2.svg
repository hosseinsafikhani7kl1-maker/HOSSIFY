<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fhDarkBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="30%" stop-color="#0b1020" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1322" stop-opacity="0.95" />
    </linearGradient>

    <!-- Orange Gradient Button -->
    <linearGradient id="orangeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Device Background -->
  <rect width="380" height="780" rx="36" fill="url(#fhDarkBg2)" stroke="#1e293b" stroke-width="4" />

  <!-- Top App Header -->
  <g transform="translate(18, 16)">
    <!-- Globe Icon (Language) -->
    <circle cx="20" cy="18" r="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="22" fill="#94a3b8" font-size="12" text-anchor="middle">🌐</text>
    <text x="20" y="36" fill="#64748b" font-family="'Vazirmatn', system-ui, sans-serif" font-size="8" text-anchor="middle">زبان</text>

    <!-- Center App Title -->
    <text x="172" y="24" fill="#ffffff" font-family="'Arial Black', system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="1.5" text-anchor="middle">FLUIDHONOR</text>

    <!-- Orange Pulse/Wave Icon Button -->
    <rect x="296" y="2" width="34" height="34" rx="10" fill="url(#orangeGrad2)" />
    <path d="M 302,19 L 310,19 L 314,8 L 318,30 L 322,14 L 326,19 L 330,19" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Date Subtitle Header -->
  <g transform="translate(190, 84)">
    <text x="0" y="0" fill="#94a3b8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="11" text-anchor="middle">۱۴۰۲ مرداد ۱۳ - دوشنبه</text>
    <circle cx="0" cy="12" r="2" fill="#475569" />
  </g>

  <!-- Main Dark Content Card -->
  <g transform="translate(16, 120)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="348" height="575" rx="20" fill="url(#cardGrad2)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Card Header Titles -->
    <text x="328" y="38" fill="#ffffff" font-family="'Vazirmatn', system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="end">فیلتراسیون و آکومولاتور</text>
    <text x="328" y="56" fill="#64748b" font-family="'Vazirmatn', system-ui, sans-serif" font-size="10" text-anchor="end">p4 - 108</text>

    <!-- Industrial Field Photo Frame (Hydraulic Skid & Accumulator Pack) -->
    <g transform="translate(16, 75)">
      <!-- Container Outer Photo Card -->
      <rect x="0" y="0" width="316" height="218" rx="14" fill="#0f172a" stroke="#1e3a8a" stroke-width="1.5" />

      <!-- Photo Background: Rig Field / Daylight Environment -->
      <rect x="2" y="2" width="312" height="214" rx="12" fill="#1e293b" />
      <!-- Sky & Outdoor Environment top -->
      <path d="M 2,2 L 314,2 L 314,80 L 2,80 Z" fill="#94a3b8" opacity="0.4" />
      <path d="M 2,60 L 314,60 L 314,216 L 2,216 Z" fill="#0f172a" />

      <!-- Heavy Blue Industrial Structural Steel Frame (Rig Skid) -->
      <rect x="20" y="20" width="276" height="175" fill="none" stroke="#1e40af" stroke-width="8" rx="4" />
      <line x1="120" y1="20" x2="120" y2="195" stroke="#1e40af" stroke-width="6" />
      <line x1="20" y1="80" x2="120" y2="80" stroke="#1e40af" stroke-width="6" />

      <!-- Left Bay: Heavy Industrial Oil Cooler & Heat Exchanger Grille -->
      <g transform="translate(32, 30)">
        <rect x="0" y="0" width="76" height="150" fill="#0f172a" stroke="#3b82f6" stroke-width="2" rx="2" />
        <!-- Vertical Grille Fins -->
        <line x1="10" y1="6" x2="10" y2="144" stroke="#475569" stroke-width="2" />
        <line x1="20" y1="6" x2="20" y2="144" stroke="#475569" stroke-width="2" />
        <line x1="30" y1="6" x2="30" y2="144" stroke="#475569" stroke-width="2" />
        <line x1="40" y1="6" x2="40" y2="144" stroke="#475569" stroke-width="2" />
        <line x1="50" y1="6" x2="50" y2="144" stroke="#475569" stroke-width="2" />
        <line x1="60" y1="6" x2="60" y2="144" stroke="#475569" stroke-width="2" />
        <line x1="68" y1="6" x2="68" y2="144" stroke="#475569" stroke-width="2" />
      </g>

      <!-- Center Bay: Heavy Yellow Nitrogen Accumulator Bottle & Filter Bank -->
      <g transform="translate(132, 30)">
        <!-- Hydraulic Manifold Block & High-Pressure Lines -->
        <rect x="0" y="30" width="150" height="120" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />

        <!-- High-Pressure Yellow Accumulator Bottle -->
        <rect x="12" y="55" width="22" height="38" rx="8" fill="#eab308" stroke="#ca8a04" stroke-width="2" />
        <rect x="17" y="48" width="12" height="8" rx="2" fill="#334155" />
        <circle cx="23" cy="46" r="3" fill="#cbd5e1" />

        <!-- High Pressure Filter Canisters (Blue Twin Bowls) -->
        <rect x="12" y="100" width="14" height="24" rx="3" fill="#1e40af" stroke="#60a5fa" stroke-width="1.5" />
        <rect x="28" y="100" width="14" height="24" rx="3" fill="#1e40af" stroke="#60a5fa" stroke-width="1.5" />
        <rect x="44" y="100" width="14" height="24" rx="3" fill="#1e40af" stroke="#60a5fa" stroke-width="1.5" />

        <!-- Manifold Gauge Panel on Right -->
        <rect x="70" y="42" width="70" height="40" fill="#0f172a" stroke="#64748b" stroke-width="1" rx="2" />
        <circle cx="85" cy="62" r="8" fill="#ffffff" stroke="#000" stroke-width="1" />
        <line x1="85" y1="62" x2="88" y2="57" stroke="#dc2626" stroke-width="1.5" />
        <circle cx="106" cy="62" r="8" fill="#ffffff" stroke="#000" stroke-width="1" />
        <line x1="106" y1="62" x2="108" y2="58" stroke="#dc2626" stroke-width="1.5" />
        <circle cx="127" cy="62" r="8" fill="#ffffff" stroke="#000" stroke-width="1" />
        <line x1="127" y1="62" x2="131" y2="60" stroke="#dc2626" stroke-width="1.5" />

        <!-- Stainless Pipe Connectors Below -->
        <rect x="68" y="98" width="20" height="30" fill="#cbd5e1" rx="2" stroke="#475569" stroke-width="1" />
        <rect x="94" y="98" width="20" height="30" fill="#cbd5e1" rx="2" stroke="#475569" stroke-width="1" />
        <rect x="120" y="98" width="20" height="30" fill="#cbd5e1" rx="2" stroke="#475569" stroke-width="1" />
      </g>
    </g>

    <!-- Floating Action Button (Layered Stack Icon) -->
    <g transform="translate(42, 500)">
      <circle cx="0" cy="0" r="28" fill="url(#orangeGrad2)" />
      <!-- Stack of 3 Layers -->
      <polygon points="0,-10 16,-3 0,4 -16,-3" fill="#000000" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M -16,3 L 0,10 L 16,3" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -16,9 L 0,16 L 16,9" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(10, 715)">
    <rect width="360" height="54" rx="20" fill="#0c1220" stroke="#1e293b" stroke-width="1" />

    <!-- Theme Sun/Moon -->
    <g transform="translate(24, 27)">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#64748b" stroke-width="1.5" />
      <line x1="-12" y1="0" x2="-9" y2="0" stroke="#64748b" stroke-width="1.5" />
      <line x1="9" y1="0" x2="12" y2="0" stroke="#64748b" stroke-width="1.5" />
      <line x1="0" y1="-12" x2="0" y2="-9" stroke="#64748b" stroke-width="1.5" />
      <line x1="0" y1="9" x2="0" y2="12" stroke="#64748b" stroke-width="1.5" />
    </g>

    <!-- Help/Question -->
    <g transform="translate(74, 27)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="0" y="4" fill="#64748b" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">?</text>
    </g>

    <!-- Document -->
    <g transform="translate(122, 27)">
      <rect x="-8" y="-9" width="16" height="18" rx="2" fill="none" stroke="#64748b" stroke-width="1.5" />
      <line x1="-4" y1="-4" x2="4" y2="-4" stroke="#64748b" stroke-width="1.5" />
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#64748b" stroke-width="1.5" />
      <line x1="-4" y1="4" x2="2" y2="4" stroke="#64748b" stroke-width="1.5" />
    </g>

    <!-- Camera/Photo Gallery (Active Tab) -->
    <g transform="translate(168, 14)">
      <rect x="-18" y="-4" width="36" height="34" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <circle cx="0" cy="13" r="5" fill="none" stroke="#f59e0b" stroke-width="2" />
      <rect x="-10" y="5" width="20" height="16" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    </g>

    <!-- Bar Chart -->
    <g transform="translate(216, 27)">
      <rect x="-6" y="-2" width="3" height="10" fill="#64748b" />
      <rect x="-1" y="-8" width="3" height="16" fill="#64748b" />
      <rect x="4" y="-5" width="3" height="13" fill="#64748b" />
    </g>

    <!-- Reload/Cycle -->
    <g transform="translate(260, 27)">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="14 6" />
    </g>

    <!-- Gauge/Speedometer -->
    <g transform="translate(304, 27)">
      <path d="M -8,4 A 9 9 0 1 1 8,4" fill="none" stroke="#64748b" stroke-width="1.5" />
      <line x1="0" y1="4" x2="4" y2="-2" stroke="#64748b" stroke-width="1.5" />
    </g>

    <!-- Chevron/Terminal -->
    <g transform="translate(342, 27)">
      <path d="M -4,-5 L 2,0 L -4,5" fill="none" stroke="#64748b" stroke-width="1.5" />
    </g>
  </g>
</svg>
