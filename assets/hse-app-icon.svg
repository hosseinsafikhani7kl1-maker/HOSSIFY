<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Carbon/Metallic Radial Gradient -->
    <radialGradient id="darkMatteBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1b222a" />
      <stop offset="45%" stop-color="#11161d" />
      <stop offset="85%" stop-color="#090c10" />
      <stop offset="100%" stop-color="#040507" />
    </radialGradient>

    <!-- Outer Squircle Bezel Gradient -->
    <linearGradient id="outerBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="35%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Neon Cyan Shield Glow Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Hard Hat Yellow Glossy Gradients -->
    <linearGradient id="helmetDome" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="12%" stop-color="#fef08a" />
      <stop offset="32%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <radialGradient id="helmetSpecular" cx="50%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="helmetBrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Hazard Stripes Pattern -->
    <pattern id="hazardStripesLeft" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="20" height="40" fill="#f59e0b" />
      <rect x="20" width="20" height="40" fill="#0f172a" />
    </pattern>

    <pattern id="hazardStripesRight" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#f59e0b" />
      <rect x="20" width="20" height="40" fill="#0f172a" />
    </pattern>

    <!-- Filters for Neon Glow & Drop Shadows -->
    <filter id="neonCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="helmet3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle Background with Beveled Metal Rim -->
  <rect x="16" y="16" width="480" height="480" rx="106" fill="url(#darkMatteBg)" stroke="url(#outerBezel)" stroke-width="6" />
  <rect x="24" y="24" width="464" height="464" rx="98" fill="none" stroke="#000000" stroke-width="4" opacity="0.6" />

  <!-- Left Side Hazard Stripes (Yellow / Black Warning) -->
  <g opacity="0.85">
    <path d="M 28,150 L 105,185 L 105,370 L 28,340 Z" fill="url(#hazardStripesLeft)" />
    <!-- Gradient Fade Overlay -->
    <path d="M 28,150 L 105,185 L 105,370 L 28,340 Z" fill="#11161d" opacity="0.25" />
  </g>

  <!-- Right Side Hazard Stripes (Yellow / Black Warning) -->
  <g opacity="0.85">
    <path d="M 484,150 L 407,185 L 407,370 L 484,340 Z" fill="url(#hazardStripesRight)" />
    <!-- Gradient Fade Overlay -->
    <path d="M 484,150 L 407,185 L 407,370 L 484,340 Z" fill="#11161d" opacity="0.25" />
  </g>

  <!-- Center Glowing Neon Cyan Shield -->
  <g filter="url(#neonCyanGlow)">
    <!-- Cyan Glowing Shield Outer Contour -->
    <path d="M 256,92 L 372,138 C 372,250 326,340 256,388 C 186,340 140,250 140,138 Z"
          fill="#061a28" stroke="#00f0ff" stroke-width="12" stroke-linejoin="round" />
    <!-- Inner Cyan Shield Highlight -->
    <path d="M 256,104 L 358,146 C 358,242 318,322 256,368 C 194,322 154,242 154,146 Z"
          fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
  </g>

  <!-- 3D Safety Yellow Industrial Hard Hat (Construction Helmet) -->
  <g filter="url(#helmet3DShadow)">
    
    <!-- Helmet Main Dome Structure -->
    <g transform="translate(256, 275)">
      
      <!-- Hard Hat Dome -->
      <path d="M -115,10 C -115,-78 -70,-130 0,-130 C 70,-130 115,-78 115,10 Z"
            fill="url(#helmetDome)" stroke="#854d0e" stroke-width="3" />

      <!-- Top Specular Highlight on Dome -->
      <ellipse cx="0" cy="-75" rx="75" ry="42" fill="url(#helmetSpecular)" />

      <!-- Center Vertical Ridges (Reinforcement Ribs of Hard Hat) -->
      <!-- Center Middle Ridge -->
      <path d="M -16,-128 C -6,-130 6,-130 16,-128 L 18,10 L -18,10 Z" fill="#fef08a" opacity="0.75" />
      <path d="M -8,-128 C -3,-130 3,-130 8,-128 L 9,10 L -9,10 Z" fill="#ffffff" opacity="0.9" />

      <!-- Left Side Ridge -->
      <path d="M -48,-115 C -42,-118 -36,-120 -30,-122 L -34,10 L -54,10 Z" fill="#fef08a" opacity="0.4" />
      
      <!-- Right Side Ridge -->
      <path d="M 30,-122 C 36,-120 42,-118 48,-115 L 54,10 L 34,10 Z" fill="#ca8a04" opacity="0.5" />

      <!-- Helmet Lateral Accessory Mount Tabs (Earmuff / Lamp Slots on Sides) -->
      <rect x="-132" y="-12" width="22" height="28" rx="5" fill="#facc15" stroke="#854d0e" stroke-width="2" />
      <rect x="110" y="-12" width="22" height="28" rx="5" fill="#ca8a04" stroke="#854d0e" stroke-width="2" />

      <!-- Front Hard Hat Visor / Curved Outer Brim -->
      <path d="M -140,10 C -140,-5 -76,-10 0,-10 C 76,-10 140,-5 140,10 C 140,34 92,44 0,44 C -92,44 -140,34 -140,10 Z"
            fill="url(#helmetBrim)" stroke="#78350f" stroke-width="3" />

      <!-- Visor Top Specular Highlight Edge -->
      <path d="M -132,10 C -132,0 -72,-4 0,-4 C 72,-4 132,0 132,10 C 132,18 88,24 0,24 C -88,24 -132,18 -132,10 Z"
            fill="#ffffff" opacity="0.45" />

      <!-- Visor Bottom Shadow Lip -->
      <path d="M -125,18 C -75,34 0,38 0,38 C 0,38 75,34 125,18 C 88,38 0,42 0,42 C 0,42 -88,38 -125,18 Z"
            fill="#78350f" opacity="0.7" />

      <!-- Black Industrial Rank Chevron Logo on Center Forehead of Helmet -->
      <g transform="translate(0, -32)">
        <!-- Top Chevron Tier (Two symmetric angled blocks) -->
        <polygon points="-32,-20 -6,-20 -6,-2 0,3 -6,8 -32,8 -20,-6" fill="#18181b" />
        <polygon points="32,-20 6,-20 6,-2 0,3 6,8 32,8 20,-6" fill="#18181b" />
        <!-- Unified clean polygon for top chevron -->
        <path d="M -30,-22 L -3,-6 L 0,-4 L 3,-6 L 30,-22 L 30,-5 L 0,13 L -30,-5 Z" fill="#18181b" />
        
        <!-- Bottom Chevron Tier -->
        <path d="M -30,0 L -3,16 L 0,18 L 3,16 L 30,0 L 30,17 L 0,35 L -30,17 Z" fill="#18181b" />
      </g>
    </g>
  </g>
</svg>
