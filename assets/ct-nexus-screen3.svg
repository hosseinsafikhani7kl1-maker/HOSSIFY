      <text x="150" y="114" fill="#38bdf8" font-size="9" font-weight="600" text-anchor="end">ورود به ماژول ←</text>
    </g>

    <!-- Row 2: Right (Well Geometry) & Left (Hydraulics) -->
    <!-- Right Card (Well Geometry) -->
    <g transform="translate(178, 138)">
      <rect width="166" height="126" rx="16" fill="url(#gridCard1)" stroke="#065f46" stroke-width="1" />
      <rect x="110" y="14" width="42" height="42" rx="12" fill="#065f46" opacity="0.3" />
      <circle cx="131" cy="35" r="10" fill="none" stroke="#34d399" stroke-width="2" />
      <text x="150" y="80" fill="#f8fafc" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="end">هندسه چاه و دالیز</text>
