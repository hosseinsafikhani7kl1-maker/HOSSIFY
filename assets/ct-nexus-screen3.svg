      <rect width="166" height="126" rx="16" fill="url(#gridCard1)" stroke="#0e7490" stroke-width="1" />
      <rect x="110" y="14" width="42" height="42" rx="12" fill="#0e7490" opacity="0.3" />
      <path d="M 120,35 L 126,35 L 129,28 L 133,42 L 137,35 L 142,35" fill="none" stroke="#22d3ee" stroke-width="2" />
      <text x="150" y="80" fill="#f8fafc" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="end">هیدرولیک و اصطکاک</text>
      <text x="150" y="96" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="end">افت فشار و سرعت بحرانی</text>
      <text x="150" y="114" fill="#22d3ee" font-size="9" font-weight="600" text-anchor="end">ورود به ماژول ←</text>
    </g>

    <!-- Row 3: Right (Cementing) & Left (Acidizing) -->
    <!-- Right Card (Cementing) -->
    <g transform="translate(178, 276)">
      <rect width="166" height="126" rx="16" fill="url(#gridCard1)" stroke="#9a3412" stroke-width="1" />
      <rect x="110" y="14" width="42" height="42" rx="12" fill="#9a3412" opacity="0.3" />
      <text x="131" y="41" fill="#fb923c" font-size="18" font-weight="bold" text-anchor="middle">⚖️</text>
      <text x="150" y="80" fill="#f8fafc" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="end">سیمان‌کاری و پلاگ</text>
      <text x="150" y="96" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="end">پلاگ تعادل و اسپیسر</text>
      <text x="150" y="114" fill="#fb923c" font-size="9" font-weight="600" text-anchor="end">ورود به ماژول ←</text>
    </g>

    <!-- Left Card (Acidizing) -->
    <g transform="translate(0, 276)">
      <rect width="166" height="126" rx="16" fill="url(#gridCard1)" stroke="#831843" stroke-width="1" />
      <rect x="110" y="14" width="42" height="42" rx="12" fill="#831843" opacity="0.3" />
      <text x="131" y="41" fill="#f472b6" font-size="18" font-weight="bold" text-anchor="middle">🔥</text>
      <text x="150" y="80" fill="#f8fafc" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="end">اسیدکاری و شستشو</text>
      <text x="150" y="96" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="end">ماتریکس و خوردگی</text>
      <text x="150" y="114" fill="#f472b6" font-size="9" font-weight="600" text-anchor="end">ورود به ماژول ←</text>
    </g>

    <!-- Row 4: Fluid Displacement / Bottom Row -->
    <g transform="translate(178, 414)">
      <rect width="166" height="120" rx="16" fill="url(#gridCard1)" stroke="#581c87" stroke-width="1" />
      <text x="150" y="76" fill="#f8fafc" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="end">جابجایی سیالات و پین‌ها</text>
      <text x="150" y="104" fill="#c084fc" font-size="9" font-weight="600" text-anchor="end">ورود به ماژول ←</text>
    </g>

    <g transform="translate(0, 414)">
      <rect width="166" height="120" rx="16" fill="url(#gridCard1)" stroke="#14532d" stroke-width="1" />
      <text x="150" y="76" fill="#f8fafc" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="end">احیاء چاه با نیتروژن</text>
      <text x="150" y="104" fill="#4ade80" font-size="9" font-weight="600" text-anchor="end">ورود به ماژول ←</text>
    </g>

