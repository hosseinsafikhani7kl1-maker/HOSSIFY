<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="100%" height="100%">
  <defs>
    <linearGradient id="hseDarkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="50%" stop-color="#060911" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <!-- Glowing Blue-Purple Header Card -->
    <linearGradient id="bluePurpleHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c38" />
      <stop offset="50%" stop-color="#0e172d" />
      <stop offset="100%" stop-color="#181e3d" />
    </linearGradient>

    <!-- Orange Gradient Button -->
    <linearGradient id="orangeBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Blue Gradient Button -->
    <linearGradient id="blueBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="softCardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Device Frame & Dark Background -->
  <rect width="360" height="760" rx="36" fill="url(#hseDarkBg)" stroke="#1e293b" stroke-width="3" />

  <!-- Top Status Bar -->
  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    <text x="24" y="28" font-weight="bold">14:25</text>
    <path d="M 280,20 L 290,20 L 285,14 Z M 300,20 L 310,20 M 320,18 L 332,18" stroke="#94a3b8" stroke-width="1.5" />
    <text x="336" y="28" text-anchor="end" font-weight="bold">91%</text>
  </g>

  <!-- Top App Navigation Bar -->
  <g transform="translate(16, 42)">
    <!-- Burger Menu -->
    <rect width="36" height="36" rx="10" fill="#131c2e" stroke="#1e2d4a" stroke-width="1" />
    <line x1="10" y1="13" x2="26" y2="13" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="18" x2="26" y2="18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="23" x2="26" y2="23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- App Logo & Title -->
    <g transform="translate(48, 0)">
      <rect width="36" height="36" rx="10" fill="#2563eb" />
      <text x="18" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="11" text-anchor="middle">HSE</text>
      
      <text x="46" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">HSE Core</text>
      <text x="46" y="29" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5">Safety, Health &amp; Environment</text>
    </g>

    <!-- Online Status Dot -->
    <circle cx="312" cy="18" r="5" fill="#10b981" />
  </g>

  <!-- Main Hero Card: RCA Incident Investigation -->
  <g transform="translate(16, 96)" filter="url(#softCardGlow)">
    <rect width="328" height="230" rx="20" fill="url(#bluePurpleHero)" stroke="#203058" stroke-width="1.5" />
    
    <!-- Top Pill Badge -->
    <g transform="translate(164, 20)">
      <rect x="-85" y="0" width="170" height="26" rx="13" fill="#182747" stroke="#2563eb" stroke-width="1" />
      <circle cx="-68" cy="13" r="5" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <text x="6" y="17" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">ماژول تخصصی مهندسی و ایمنی صنعتی</text>
    </g>

    <!-- Main Title -->
    <text x="164" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" text-anchor="middle">«بررسی حادثه و تحلیل علل ریشه‌ای»</text>
    
    <!-- Subtitle Description -->
    <text x="164" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">سیستم جامع مدیریت، ارزیابی، طبقه‌بندی، تحلیل علل ریشه‌ای (RCA)، تدوین موانع و</text>
    <text x="164" y="122" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">اقدامات اصلاحی (CAPA) بر اساس استانداردهای بین‌المللی ISO 45001، OSHA و</text>
    <text x="164" y="139" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">IOGP HSE</text>

    <!-- Dual Action Buttons -->
    <g transform="translate(20, 165)">
      <!-- Orange Button: Dashboard -->
      <rect width="136" height="42" rx="14" fill="url(#orangeBtn)" />
      <g transform="translate(24, 26)">
        <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">📊 داشبورد حوادث</text>
      </g>

      <!-- Blue Button: New Project -->
      <g transform="translate(148, 0)">
        <rect width="140" height="42" rx="14" fill="url(#blueBtn)" />
        <text x="70" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">+ ثبت پروژه بررسی جدید</text>
      </g>
    </g>
  </g>

  <!-- Segmented Sub-Navbar Pill (Tabs) -->
  <g transform="translate(16, 342)">
    <rect width="328" height="48" rx="16" fill="#ffffff" />
    <g transform="translate(8, 6)">
      <!-- Active Tab: Dashboard -->
      <rect x="220" y="0" width="92" height="36" rx="12" fill="#18181b" />
      <text x="266" y="22" fill="#facc15" font-family="system-ui, sans-serif" font-weight="bold" font-size="10.5" text-anchor="middle">📊 داشبورد</text>

      <!-- Tab 2: Projects -->
      <text x="175" y="22" fill="#52525b" font-family="system-ui, sans-serif" font-weight="bold" font-size="10.5" text-anchor="middle">📋 پروژه‌ها</text>
      <rect x="138" y="10" width="18" height="16" rx="5" fill="#f4f4f5" />
      <text x="147" y="22" fill="#71717a" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">۱۲</text>

      <!-- Tab 3: Investigation Team -->
      <text x="68" y="22" fill="#52525b" font-family="system-ui, sans-serif" font-weight="bold" font-size="10.5" text-anchor="middle">👥 تیم بررسی</text>
    </g>
  </g>

  <!-- Metric Card 1 (Total Projects) -->
  <g transform="translate(16, 404)" filter="url(#softCardGlow)">
    <rect width="328" height="92" rx="18" fill="#ffffff" />
    <g transform="translate(20, 16)">
      <text x="288" y="14" fill="#71717a" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">کل پروژه‌های بررسی</text>
      <text x="288" y="48" fill="#09090b" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="end">12</text>
      <text x="288" y="66" fill="#10b981" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" text-anchor="end">۱۲ رویداد عملیاتی فعال</text>
    </g>
  </g>

  <!-- Metric Card 2 (Critical & High Risk) -->
  <g transform="translate(16, 508)" filter="url(#softCardGlow)">
    <rect width="328" height="92" rx="18" fill="#ffffff" />
    <g transform="translate(20, 16)">
      <text x="288" y="14" fill="#71717a" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">رویدادهای بحرانی و بالا</text>
      <text x="288" y="48" fill="#e11d48" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="end">10</text>
      <text x="288" y="66" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">نیازمند نظارت مستمر</text>
    </g>
  </g>

  <!-- Metric Card 3 (CAPA Actions) -->
  <g transform="translate(16, 612)" filter="url(#softCardGlow)">
    <rect width="328" height="92" rx="18" fill="#ffffff" />
    <g transform="translate(20, 16)">
      <text x="288" y="14" fill="#71717a" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">اقدامات CAPA در حال اجرا</text>
      <text x="288" y="48" fill="#d97706" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="end">28</text>
      <text x="288" y="66" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">تحت پیگیری سیستم</text>
    </g>
  </g>

  <!-- Bottom Home Indicator -->
  <rect x="130" y="744" width="100" height="4" rx="2" fill="#475569" />
</svg>
