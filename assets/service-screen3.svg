<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="100%" height="100%">
  <defs>
    <linearGradient id="calBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <!-- Calendar Container Grad -->
    <linearGradient id="calCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101726" />
      <stop offset="100%" stop-color="#0b111c" />
    </linearGradient>

    <filter id="calCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="360" height="760" rx="36" fill="url(#calBgGrad)" stroke="#1e293b" stroke-width="3" />

  <!-- Top System Status Bar -->
  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    <text x="24" y="28" font-weight="bold">19:34</text>
    <g transform="translate(280, 16)">
      <circle cx="6" cy="7" r="3" fill="#94a3b8" />
      <path d="M 14,3 L 20,11 M 24,5 L 30,11" stroke="#94a3b8" stroke-width="1.5" />
      <rect x="36" y="2" width="16" height="9" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.2" />
      <rect x="38" y="4" width="9" height="5" rx="1" fill="#94a3b8" />
    </g>
  </g>

  <!-- Top App Navigation Header Bar -->
  <g transform="translate(14, 40)">
    <!-- Bell Notification Button -->
    <rect width="34" height="34" rx="10" fill="#1e1810" stroke="#452a0a" stroke-width="1" />
    <path d="M 13,11 C 13,9 21,9 21,11 C 21,15 24,18 24,20 L 10,20 C 10,18 13,15 13,11 Z M 15,22 C 15,23.5 19,23.5 19,22" fill="none" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Grid Menu Button -->
    <rect x="42" y="0" width="38" height="34" rx="10" fill="#131c2e" stroke="#1f2d48" stroke-width="1" />
    <rect x="52" y="9" width="6" height="6" rx="1.5" fill="#94a3b8" />
    <rect x="62" y="9" width="6" height="6" rx="1.5" fill="#94a3b8" />
    <rect x="52" y="19" width="6" height="6" rx="1.5" fill="#94a3b8" />
    <rect x="62" y="19" width="6" height="6" rx="1.5" fill="#94a3b8" />

    <!-- Sun / Theme Toggle Button -->
    <rect x="88" y="0" width="36" height="34" rx="10" fill="#131c2e" stroke="#ca8a04" stroke-width="1" />
    <circle cx="106" cy="17" r="5" fill="none" stroke="#fde047" stroke-width="1.5" />
    <line x1="106" y1="8" x2="106" y2="10" stroke="#fde047" stroke-width="1.5" stroke-linecap="round" />
    <line x1="106" y1="24" x2="106" y2="26" stroke="#fde047" stroke-width="1.5" stroke-linecap="round" />
    <line x1="97" y1="17" x2="99" y2="17" stroke="#fde047" stroke-width="1.5" stroke-linecap="round" />
    <line x1="113" y1="17" x2="115" y2="17" stroke="#fde047" stroke-width="1.5" stroke-linecap="round" />

    <!-- Search Input Box -->
    <g transform="translate(130, 0)">
      <rect width="144" height="34" rx="10" fill="#101726" stroke="#1c2842" stroke-width="1" />
      <text x="12" y="21" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5">🔍 جستجوی سریع...</text>
    </g>

    <!-- User Profile Badge (LK) -->
    <g transform="translate(282, 0)">
      <rect width="38" height="34" rx="10" fill="#f59e0b" />
      <text x="19" y="22" fill="#000000" font-family="system-ui, sans-serif" font-weight="900" font-size="12" text-anchor="middle">LK</text>
    </g>
  </g>

  <!-- Main Calendar Section Card -->
  <g transform="translate(14, 88)" filter="url(#calCardShadow)">
    <rect width="332" height="490" rx="18" fill="url(#calCardGrad)" stroke="#1e2b40" stroke-width="1.2" />
    
    <g transform="translate(14, 14)">
      <!-- Calendar Icon Badge -->
      <rect x="264" y="0" width="40" height="40" rx="10" fill="#1e1b4b" stroke="#312e81" stroke-width="1" />
      <text x="284" y="26" fill="#a5b4fc" font-size="18" text-anchor="middle">📅</text>

      <!-- Calendar Title -->
      <text x="252" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" text-anchor="end">مرداد ۱۴۰۲ (July - August 2023)</text>
      <text x="252" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="end">مدیریت زمانی سررسیدها و تسویه‌ها</text>

      <!-- Calendar Switcher & Month Navigation -->
      <g transform="translate(0, 52)">
        <!-- Left & Right Arrow Buttons -->
        <rect x="0" y="0" width="30" height="28" rx="8" fill="#131c2c" stroke="#1f2d45" stroke-width="1" />
        <text x="15" y="18" fill="#94a3b8" font-size="12" text-anchor="middle">‹</text>

        <rect x="36" y="0" width="56" height="28" rx="8" fill="#131c2c" stroke="#1f2d45" stroke-width="1" />
        <text x="64" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">امروز</text>

        <rect x="98" y="0" width="30" height="28" rx="8" fill="#131c2c" stroke="#1f2d45" stroke-width="1" />
        <text x="113" y="18" fill="#94a3b8" font-size="12" text-anchor="middle">›</text>

        <!-- View Tabs (تقویم / لیست) -->
        <rect x="180" y="0" width="124" height="28" rx="8" fill="#0b111c" />
        <!-- Tab 1: تقویم (Active) -->
        <rect x="238" y="2" width="64" height="24" rx="6" fill="#1e293b" />
        <text x="270" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">📅 تقویم</text>
        <!-- Tab 2: لیست -->
        <text x="210" y="18" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">≡ لیست</text>
      </g>

      <!-- Days of Week Header -->
      <g transform="translate(0, 94)" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">
        <text x="18" y="12">ش</text>
        <text x="61" y="12">ی</text>
        <text x="104" y="12">د</text>
        <text x="147" y="12">س</text>
        <text x="190" y="12">چ</text>
        <text x="233" y="12">پ</text>
        <text x="286" y="12" fill="#ef4444">ج</text>
      </g>

      <!-- Monthly Circular Days Grid (5 Rows x 7 Cols) -->
      <g transform="translate(0, 116)">
        <!-- Row 1 -->
        <circle cx="18" cy="18" r="16" fill="#334155" />
        <text x="18" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="10.5" text-anchor="middle">۱</text>

        <circle cx="61" cy="18" r="16" fill="#1e293b" />
        <text x="61" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۲</text>

        <circle cx="104" cy="18" r="16" fill="#1e293b" />
        <text x="104" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۳</text>

        <circle cx="147" cy="18" r="16" fill="#1e293b" />
        <text x="147" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۴</text>

        <circle cx="190" cy="18" r="16" fill="#1e293b" />
        <text x="190" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۵</text>

        <circle cx="233" cy="18" r="16" fill="#1e293b" />
        <text x="233" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۶</text>

        <circle cx="286" cy="18" r="16" fill="#1e293b" />
        <text x="286" y="22" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۷</text>

        <!-- Row 2 -->
        <circle cx="18" cy="56" r="16" fill="#1e293b" />
        <text x="18" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۸</text>

        <circle cx="61" cy="56" r="16" fill="#1e293b" />
        <text x="61" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۹</text>

        <circle cx="104" cy="56" r="16" fill="#1e293b" />
        <text x="104" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۱۰</text>

        <circle cx="147" cy="56" r="16" fill="#1e293b" />
        <text x="147" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۱۱</text>

        <circle cx="190" cy="56" r="16" fill="#1e293b" />
        <text x="190" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۱۲</text>

        <circle cx="233" cy="56" r="16" fill="#1e293b" />
        <text x="233" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۱۳</text>

        <circle cx="286" cy="56" r="16" fill="#1e293b" />
        <text x="286" y="60" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۱۴</text>

        <!-- Row 3 -->
        <circle cx="18" cy="94" r="16" fill="#1e293b" />
        <text x="18" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۱۵</text>

        <circle cx="61" cy="94" r="16" fill="#1e293b" />
        <text x="61" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۱۶</text>

        <circle cx="104" cy="94" r="16" fill="#1e293b" />
        <text x="104" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۱۷</text>

        <circle cx="147" cy="94" r="16" fill="#1e293b" />
        <text x="147" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۱۸</text>

        <circle cx="190" cy="94" r="16" fill="#1e293b" />
        <text x="190" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۱۹</text>

        <circle cx="233" cy="94" r="16" fill="#1e293b" />
        <text x="233" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۲۰</text>

        <circle cx="286" cy="94" r="16" fill="#1e293b" />
        <text x="286" y="98" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۲۱</text>

        <!-- Row 4 -->
        <circle cx="18" cy="132" r="16" fill="#1e293b" />
        <text x="18" y="136" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۲۲</text>

        <circle cx="61" cy="132" r="16" fill="#1e293b" />
        <text x="61" y="136" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۲۳</text>

        <circle cx="104" cy="132" r="16" fill="#1e293b" />
        <text x="104" y="136" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۲۴</text>

        <circle cx="147" cy="132" r="16" fill="#1e293b" />
        <text x="147" y="136" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۲۵</text>

        <circle cx="190" cy="132" r="16" fill="#1e293b" />
        <text x="190" y="136" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۲۶</text>

        <circle cx="233" cy="132" r="16" fill="#1e293b" />
        <text x="233" y="136" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۲۷</text>

        <circle cx="286" cy="132" r="16" fill="#1e293b" />
        <text x="286" y="136" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۲۸</text>

        <!-- Row 5 -->
        <circle cx="18" cy="170" r="16" fill="#1e293b" />
        <text x="18" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۲۹</text>

        <circle cx="61" cy="170" r="16" fill="#1e293b" />
        <text x="61" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۳۰</text>

        <circle cx="104" cy="170" r="16" fill="#1e293b" />
        <text x="104" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">۳۱</text>
      </g>

      <line x1="0" y1="316" x2="304" y2="316" stroke="#1e293b" stroke-width="1" />

      <!-- Category Filter Chips (Chips Grid 3x2) -->
      <g transform="translate(0, 328)">
        <!-- Chip 1: اقساط وام (بنفش) -->
        <rect x="204" y="0" width="100" height="26" rx="8" fill="#1e1b4b" stroke="#312e81" stroke-width="1" />
        <circle cx="294" cy="13" r="4" fill="#818cf8" />
        <text x="250" y="17" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">اقساط وام</text>

        <!-- Chip 2: سرویس خودرو (سبز فیروزه‌ای) -->
        <rect x="102" y="0" width="98" height="26" rx="8" fill="#064e3b" stroke="#047857" stroke-width="1" />
        <circle cx="190" cy="13" r="4" fill="#34d399" />
        <text x="148" y="17" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">سرویس خودرو</text>

        <!-- Chip 3: تاسیسات خانه (صورتی) -->
        <rect x="0" y="0" width="98" height="26" rx="8" fill="#701a75" stroke="#a21caf" stroke-width="1" />
        <circle cx="88" cy="13" r="4" fill="#f472b6" />
        <text x="46" y="17" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">تاسیسات خانه</text>

        <!-- Row 2 of Chips -->
        <!-- Chip 4: مناسبت‌ها (زرد) -->
        <rect x="204" y="32" width="100" height="26" rx="8" fill="#451a03" stroke="#78350f" stroke-width="1" />
        <circle cx="294" cy="45" r="4" fill="#fde047" />
        <text x="250" y="49" fill="#fef08a" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">مناسبت‌ها</text>

        <!-- Chip 5: چکاپ دوره‌ای (بنفش ملایم) -->
        <rect x="102" y="32" width="98" height="26" rx="8" fill="#3b0764" stroke="#6b21a8" stroke-width="1" />
        <circle cx="190" cy="45" r="4" fill="#c084fc" />
        <text x="148" y="49" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">چکاپ دوره‌ای</text>

        <!-- Chip 6: کارت گارانتی (آبی) -->
        <rect x="0" y="32" width="98" height="26" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
        <circle cx="88" cy="45" r="4" fill="#38bdf8" />
        <text x="46" y="49" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">کارت گارانتی</text>
      </g>
    </g>
  </g>

  <!-- Bottom Floating Card: تسک‌های بدون زمان‌بندی (افزودن سریع و درگ به تقویم) -->
  <g transform="translate(14, 590)" filter="url(#calCardShadow)">
    <rect width="332" height="135" rx="16" fill="#0f1728" stroke="#1f2d47" stroke-width="1.2" />
    <g transform="translate(14, 14)">
      
      <!-- Drag & Drop Yellow Tag -->
      <rect x="0" y="0" width="70" height="22" rx="6" fill="#451a03" stroke="#78350f" stroke-width="1" />
      <text x="35" y="15" fill="#fde047" font-family="system-ui, sans-serif" font-weight="bold" font-size="8.5" text-anchor="middle">Drag &amp; Drop</text>

      <!-- Yellow Icon Button -->
      <rect x="268" y="0" width="36" height="36" rx="10" fill="#f59e0b" />
      <text x="286" y="24" fill="#000000" font-size="16" text-anchor="middle">✨</text>

      <text x="256" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="11.5" text-anchor="end">تسک‌های بدون زمان‌بندی (افزودن سریع و درگ)</text>
      <text x="256" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="end">می‌توانید آیتم‌ها را مستقیماً روی روزهای مورد نظر تقویم درگ کنید</text>

      <!-- Quick Add Input Box Mockup -->
      <g transform="translate(0, 52)">
        <rect width="304" height="42" rx="10" fill="#080d16" stroke="#172538" stroke-width="1" />
        <rect x="264" y="6" width="32" height="30" rx="8" fill="#f59e0b" />
        <text x="280" y="26" fill="#000000" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">+</text>
        
        <text x="252" y="26" fill="#475569" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="end">عنوان تسک یا یادآوری جدید...</text>
      </g>
    </g>
  </g>

  <!-- Bottom Home Indicator -->
  <rect x="130" y="744" width="100" height="4" rx="2" fill="#475569" />
</svg>
