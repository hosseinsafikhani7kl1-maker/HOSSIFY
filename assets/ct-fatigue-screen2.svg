<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091424" />
      <stop offset="50%" stop-color="#060c18" />
      <stop offset="100%" stop-color="#02060d" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132035" />
      <stop offset="100%" stop-color="#0b1322" />
    </linearGradient>
    <linearGradient id="fatigueCurveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect width="360" height="760" rx="36" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="3" />

  <!-- Status Bar -->
  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    <text x="24" y="28" font-weight="bold">11:22</text>
    <text x="336" y="28" text-anchor="end">4G 98%</text>
  </g>

  <!-- App Header -->
  <g transform="translate(20, 42)">
    <text x="0" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="16">توزیع خستگی در طول چاه (Fatigue Twin)</text>
    <text x="320" y="24" text-anchor="end" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">طول: ۱۲,۵۰۰ ft</text>
  </g>

  <!-- Summary Health KPIs Grid -->
  <g transform="translate(20, 80)">
    <!-- KPI 1: Max Accumulated Fatigue -->
    <rect width="98" height="68" rx="10" fill="#0b1322" stroke="#ef4444" stroke-width="1.2" />
    <text x="10" y="20" fill="#ef4444" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">حداکثر خستگی</text>
    <text x="10" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="17">78.4%</text>
    <text x="10" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">در عمق 3,200 ft</text>

    <!-- KPI 2: Remaining Cycles -->
    <g transform="translate(110, 0)">
      <rect width="98" height="68" rx="10" fill="#0b1322" stroke="#f59e0b" stroke-width="1" />
      <text x="10" y="20" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">چرخه باقیمانده</text>
      <text x="10" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="17">42 <tspan font-size="10" fill="#64748b">Trips</tspan></text>
      <text x="10" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">قبل از مرز بحرانی</text>
    </g>

    <!-- KPI 3: Safety Factor -->
    <g transform="translate(220, 0)">
      <rect width="100" height="68" rx="10" fill="#0b1322" stroke="#10b981" stroke-width="1" />
      <text x="10" y="20" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">ضریب اطمینان</text>
      <text x="10" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="17">1.28</text>
      <text x="10" y="58" fill="#34d399" font-family="system-ui, sans-serif" font-size="8.5">وضعیت: مجاز</text>
    </g>
  </g>

  <!-- Interactive Depth vs. Fatigue Life Chart Card -->
  <g transform="translate(20, 162)">
    <rect width="320" height="360" rx="16" fill="url(#cardGrad2)" stroke="#1e3a5f" stroke-width="1.2" />
    
    <g transform="translate(16, 16)">
      <text x="0" y="14" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">پروفایل نرخ آسیب در طول رشته لوله</text>
      <text x="288" y="14" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">مدل Coffin-Manson</text>

      <!-- Chart Canvas Box -->
      <g transform="translate(0, 32)">
        <rect width="288" height="230" rx="8" fill="#060e19" stroke="#1e293b" stroke-width="1" />
        
        <!-- Y-Axis Grid Lines (Fatigue %) -->
        <g stroke="#1e293b" stroke-width="1" stroke-dasharray="2 4">
          <line x1="35" y1="30" x2="275" y2="30" />
          <line x1="35" y1="80" x2="275" y2="80" />
          <line x1="35" y1="130" x2="275" y2="130" />
          <line x1="35" y1="180" x2="275" y2="180" />
        </g>

        <!-- Red Critical 80% Limit Line -->
        <line x1="35" y1="50" x2="275" y2="50" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2" />
        <text x="272" y="44" text-anchor="end" fill="#ef4444" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">حد هشدار برش لوله (80%)</text>

        <!-- Y Axis Labels -->
        <g fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="end">
          <text x="30" y="34">100%</text>
          <text x="30" y="84">75%</text>
          <text x="30" y="134">50%</text>
          <text x="30" y="184">25%</text>
        </g>

        <!-- X Axis Labels (Depth in Feet) -->
        <g fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">
          <text x="45" y="215">0'</text>
          <text x="105" y="215">3,000'</text>
          <text x="165" y="215">6,000'</text>
          <text x="225" y="215">9,000'</text>
          <text x="265" y="215">12k'</text>
        </g>

        <!-- Actual Fatigue Curve Path -->
        <path d="M45,185 C65,180 85,60 110,55 C135,50 155,140 185,150 C215,160 245,175 265,185" fill="none" stroke="url(#fatigueCurveGrad)" stroke-width="3.5" stroke-linecap="round" />

        <!-- Peak Indicator Marker -->
        <circle cx="110" cy="55" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
        <rect x="75" y="12" width="70" height="20" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
        <text x="110" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">3,200 ft : 78.4%</text>
      </g>

      <!-- Bottom Recommendations -->
      <g transform="translate(0, 275)">
        <rect width="288" height="48" rx="8" fill="#1c1917" stroke="#f59e0b" stroke-width="1" />
        <text x="12" y="20" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">پیشنهاد سیستم دوقلوی دیجیتال:</text>
        <text x="12" y="36" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="9.5">اجرای عملیات برش ۵۰ متری انتهای لوله جهت تغییر نقاط خستگی</text>
      </g>
    </g>
  </g>

  <!-- Bottom CTA -->
  <g transform="translate(20, 540)">
    <rect width="320" height="50" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="160" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">ورود به ماشین‌حساب برش لوله (Cutoff) ←</text>
  </g>
</svg>
