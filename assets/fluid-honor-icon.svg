<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="hpuBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0c1a30" />
      <stop offset="45%" stop-color="#071122" />
      <stop offset="85%" stop-color="#030813" />
      <stop offset="100%" stop-color="#01040a" />
    </radialGradient>

    <!-- Orange Gradient for 'H' -->
    <linearGradient id="orangeH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Metallic Tank Gradient -->
    <linearGradient id="tankMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33475b" />
      <stop offset="35%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Motor Silver Metallic Gradient -->
    <linearGradient id="motorSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#64748b" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Valve Block Steel Gradient -->
    <linearGradient id="steelBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Cyan Neon Glow Filter -->
    <filter id="neonPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Shadow for HPU Unit -->
    <filter id="hpuDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base Squircle with Glowing Cyan Border -->
  <rect width="512" height="512" rx="108" fill="url(#hpuBg)" />
  <rect x="6" y="6" width="500" height="500" rx="102" fill="none" stroke="#38bdf8" stroke-width="3.5" opacity="0.85" />
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.4" />

  <!-- ================= TOP LOGO TEXT: "FH" ================= -->
  <g transform="translate(116, 26)">
    <!-- Letter 'F' (White with Metallic Top Glint) -->
    <g transform="skewX(-15)">
      <!-- Drop Shadow for F -->
      <path d="M 30,105 L 62,105 L 62,65 L 105,65 L 105,42 L 62,42 L 62,24 L 122,24 L 122,0 L 30,0 Z" fill="#000000" opacity="0.6" transform="translate(6, 6)" />
      <!-- Main F Shape -->
      <path d="M 30,105 L 62,105 L 62,65 L 105,65 L 105,42 L 62,42 L 62,24 L 122,24 L 122,0 L 30,0 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Subtle internal highlight -->
      <path d="M 34,4 L 118,4 L 118,12 L 34,12 Z" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Letter 'H' (High-Energy Industrial Orange) -->
    <g transform="translate(132, 0) skewX(-15)">
      <!-- Drop Shadow for H -->
      <path d="M 30,105 L 62,105 L 62,65 L 94,65 L 94,105 L 126,105 L 126,0 L 94,0 L 94,42 L 62,42 L 62,0 L 30,0 Z" fill="#000000" opacity="0.6" transform="translate(6, 6)" />
      <!-- Main H Shape -->
      <path d="M 30,105 L 62,105 L 62,65 L 94,65 L 94,105 L 126,105 L 126,0 L 94,0 L 94,42 L 62,42 L 62,0 L 30,0 Z" fill="url(#orangeH)" stroke="#fb923c" stroke-width="1.5" />
      <!-- Orange Specular Top Edge -->
      <path d="M 34,4 L 60,4 L 60,12 L 34,12 Z" fill="#ffedd5" opacity="0.6" />
      <path d="M 98,4 L 124,4 L 124,12 L 98,12 Z" fill="#ffedd5" opacity="0.6" />
    </g>
  </g>

  <!-- ================= 3D INDUSTRIAL HYDRAULIC POWER UNIT (HPU) ================= -->
  <g filter="url(#hpuDropShadow)" transform="translate(0, 10)">
    
    <!-- 1. MAIN OIL RESERVOIR TANK (Isometric Box) -->
    <!-- Tank Base Drop Shadow -->
    <polygon points="50,420 280,450 435,395 205,365" fill="#000000" opacity="0.7" />

    <!-- Tank Front Face -->
    <path d="M 145,280 L 300,280 L 300,430 L 145,430 Z" fill="url(#tankMetallic)" stroke="#475569" stroke-width="1.5" />
    <!-- Tank Left Face (Cooler Grille Face) -->
    <path d="M 45,245 L 145,280 L 145,430 L 45,395 Z" fill="#172338" stroke="#334155" stroke-width="1.5" />
    <!-- Tank Top Plate -->
    <path d="M 45,245 L 200,245 L 300,280 L 145,280 Z" fill="#2d3d52" stroke="#475569" stroke-width="1.5" />

    <!-- Tank Right Face / Hose Connections Side -->
    <path d="M 300,280 L 420,245 L 420,395 L 300,430 Z" fill="#131e30" stroke="#334155" stroke-width="1.5" />
    <!-- Top Plate Right Extension -->
    <path d="M 200,245 L 320,210 L 420,245 L 300,280 Z" fill="#243346" stroke="#475569" stroke-width="1.5" />

    <!-- Tank Structural Ribs / Weld Lines -->
    <line x1="200" y1="280" x2="200" y2="430" stroke="#334155" stroke-width="3" />
    <line x1="250" y1="280" x2="250" y2="430" stroke="#334155" stroke-width="3" />
    <line x1="95" y1="262" x2="95" y2="412" stroke="#1e293b" stroke-width="2" />

    <!-- Radiator / Cooler Louver Grille on Left Side -->
    <g transform="translate(52, 260) skewY(19)">
      <rect x="0" y="0" width="76" height="92" rx="6" fill="#090d16" stroke="#64748b" stroke-width="2" />
      <!-- Louver Slits -->
      <g stroke="#38bdf8" stroke-width="1.5" opacity="0.7">
        <line x1="8" y1="12" x2="68" y2="12" />
        <line x1="8" y1="20" x2="68" y2="20" />
        <line x1="8" y1="28" x2="68" y2="28" />
        <line x1="8" y1="36" x2="68" y2="36" />
        <line x1="8" y1="44" x2="68" y2="44" />
        <line x1="8" y1="52" x2="68" y2="52" />
        <line x1="8" y1="60" x2="68" y2="60" />
        <line x1="8" y1="68" x2="68" y2="68" />
        <line x1="8" y1="76" x2="68" y2="76" />
      </g>
      <!-- Corner Hex Bolts -->
      <circle cx="6" cy="6" r="2.5" fill="#94a3b8" />
      <circle cx="70" cy="6" r="2.5" fill="#94a3b8" />
      <circle cx="6" cy="86" r="2.5" fill="#94a3b8" />
      <circle cx="70" cy="86" r="2.5" fill="#94a3b8" />
    </g>

    <!-- Filler / Breather Cap on Tank Top -->
    <ellipse cx="215" cy="260" rx="14" ry="7" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="208" y="248" width="14" height="8" rx="2" fill="#94a3b8" />

    <!-- 2. ELECTRIC MOTOR & COUPLING (Mounted on Tank Top Left) -->
    <g transform="translate(80, 135)">
      <!-- Motor Mounting Foot / Base Plate -->
      <path d="M 0,105 L 85,105 L 75,118 L -10,118 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

      <!-- Motor Cylinder Body -->
      <ellipse cx="60" cy="55" rx="38" ry="46" fill="url(#motorSilver)" stroke="#94a3b8" stroke-width="1.5" />
      <path d="M 22,55 L 22,95 C 22,120 98,120 98,95 L 98,55 Z" fill="#334155" stroke="#64748b" stroke-width="1.5" />

      <!-- Motor Cooling Fins (Ribbed Horizontal Rings) -->
      <g stroke="#1e293b" stroke-width="2.5">
        <line x1="24" y1="40" x2="96" y2="40" />
        <line x1="22" y1="52" x2="98" y2="52" />
        <line x1="22" y1="64" x2="98" y2="64" />
        <line x1="23" y1="76" x2="97" y2="76" />
        <line x1="26" y1="88" x2="94" y2="88" />
      </g>

      <!-- Rear Fan Cowl / End Cap -->
      <path d="M 22,55 C 22,25 98,25 98,55 C 98,85 22,85 22,55 Z" fill="#475569" stroke="#94a3b8" stroke-width="2" />
      <circle cx="60" cy="55" r="16" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />

      <!-- Terminal Box on Motor Top -->
      <rect x="70" y="15" width="26" height="22" rx="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(-15 70 15)" />

      <!-- Bell Housing / Coupling to Hydraulic Pump -->
      <path d="M 98,62 L 140,70 L 140,95 L 98,95 Z" fill="url(#motorSilver)" stroke="#64748b" stroke-width="1.5" />
      <ellipse cx="140" cy="82" rx="8" ry="14" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />

      <!-- Hydraulic Pump Housing -->
      <rect x="140" y="70" width="34" height="26" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="157" cy="83" r="7" fill="#475569" stroke="#94a3b8" stroke-width="1" />
    </g>

    <!-- 3. HYDRAULIC VALVE MANIFOLD BLOCK & PRESSURE GAUGE (Right Section) -->
    <g transform="translate(265, 130)">
      <!-- Heavy Valve Block (Rectangular Solid Aluminum/Steel) -->
      <polygon points="5,110 95,95 135,115 45,130" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5" />
      <polygon points="5,110 45,130 45,160 5,140" fill="#334155" stroke="#475569" stroke-width="1.5" />
      <polygon points="45,130 135,115 135,145 45,160" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

      <!-- Valve Cartridges / Solenoid Stacks on Top of Manifold -->
      <rect x="65" y="85" width="16" height="22" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
      <circle cx="73" cy="80" r="5" fill="#f59e0b" stroke="#000" stroke-width="1" />
      
      <rect x="92" y="80" width="16" height="22" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
      <circle cx="100" cy="75" r="5" fill="#f59e0b" stroke="#000" stroke-width="1" />

      <rect x="115" y="92" width="14" height="18" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1" />

      <!-- Ports on Front Face -->
      <circle cx="20" cy="130" r="4" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
      <circle cx="34" cy="135" r="4" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />

      <!-- Precision Pressure Gauge (Dial & Pointer) -->
      <g transform="translate(56, 42)">
        <!-- Gauge Stem / Fitting -->
        <rect x="-4" y="32" width="8" height="20" fill="#94a3b8" stroke="#475569" stroke-width="1" />
        <polygon points="-6,40 6,40 6,46 -6,46" fill="#cbd5e1" />

        <!-- Gauge Bezel / Outer Ring -->
        <circle cx="0" cy="0" r="40" fill="#0f172a" stroke="#cbd5e1" stroke-width="4" />
        <circle cx="0" cy="0" r="36" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />

        <!-- Gauge Scale & Tick Marks -->
        <circle cx="0" cy="0" r="30" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2 4" />
        <!-- Red High Pressure Zone -->
        <path d="M 16,-24 A 29 29 0 0 1 28,0" fill="none" stroke="#ef4444" stroke-width="3.5" />
        <!-- Green Safe Zone -->
        <path d="M -24,16 A 29 29 0 0 1 12,-26" fill="none" stroke="#22c55e" stroke-width="3" />

        <!-- Gauge Center Hub -->
        <circle cx="0" cy="0" r="5" fill="#0f172a" />
        <circle cx="0" cy="0" r="2.5" fill="#cbd5e1" />

        <!-- Needle Pointer (Pointing at 10 o'clock - Perfect Operating Pressure) -->
        <line x1="0" y1="0" x2="-18" y2="-18" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
        <polygon points="-18,-18 -12,-16 -16,-12" fill="#0284c7" />

        <!-- Subtle Glass Highlight on Gauge -->
        <path d="M -26,-15 A 30 30 0 0 1 15,-26 Z" fill="#ffffff" opacity="0.4" />
      </g>
    </g>

    <!-- 4. HEAVY HIGH-PRESSURE HYDRAULIC HOSES (Exiting Front Right) -->
    <g transform="translate(305, 300)">
      <!-- Hose 1 (Top) -->
      <!-- Metal Swivel Crimp Fitting -->
      <rect x="0" y="0" width="24" height="12" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="1.5" transform="rotate(20)" />
      <!-- Flexible Rubber Hose Sweeping Downwards -->
      <path d="M 18,7 C 45,18 70,55 85,115 C 92,145 94,160 95,170" fill="none" stroke="#090d16" stroke-width="14" stroke-linecap="round" />
      <path d="M 18,7 C 45,18 70,55 85,115 C 92,145 94,160 95,170" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
      <path d="M 18,7 C 45,18 70,55 85,115 C 92,145 94,160 95,170" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />

      <!-- Hose 2 (Bottom) -->
      <rect x="-2" y="24" width="24" height="12" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="1.5" transform="rotate(20)" />
      <path d="M 16,31 C 42,42 66,78 78,135 C 84,160 85,175 86,180" fill="none" stroke="#090d16" stroke-width="14" stroke-linecap="round" />
      <path d="M 16,31 C 42,42 66,78 78,135 C 84,160 85,175 86,180" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
      <path d="M 16,31 C 42,42 66,78 78,135 C 84,160 85,175 86,180" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />
    </g>

    <!-- 5. GLOWING NEON CYAN SIGNAL / TELEMETRY PULSE LINE & VERIFIED CHECKMARK -->
    <g filter="url(#neonPulse)">
      <!-- Continuous Glowing Cyan Telemetry Line -->
      <!-- Connects from Pressure Gauge, steps across reservoir with pulse wave, and ends at Checkmark -->
      <path d="M 321,215 L 321,265 L 290,265 L 290,300 L 210,300 L 195,335 L 180,270 L 165,335 L 150,300 L 115,300" fill="none" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 321,215 L 321,265 L 290,265 L 290,300 L 210,300 L 195,335 L 180,270 L 165,335 L 150,300 L 115,300" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Line extension to Checkmark Badge on Right -->
      <path d="M 321,265 L 321,300 L 440,300" fill="none" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 321,265 L 321,300 L 440,300" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Glowing Circular Verified Badge -->
      <g transform="translate(450, 300)">
        <circle cx="0" cy="0" r="22" fill="#041628" stroke="#00f2fe" stroke-width="4" />
        <!-- Green Inner Badge -->
        <circle cx="0" cy="0" r="16" fill="#15803d" />
        <!-- Sharp White/Light-Green Checkmark -->
        <polyline points="-8,0 -2,7 9,-6" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM BRANDING: "— FLUIDHONOR —" ================= -->
  <g transform="translate(256, 480)">
    <!-- Bronze Left Accent Line -->
    <line x1="-190" y1="0" x2="-120" y2="0" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
    <circle cx="-190" cy="0" r="2.5" fill="#f59e0b" />

    <!-- Center Futuristic Metallic Brand Name -->
    <text x="0" y="5" fill="#ffffff" font-family="'Arial Black', system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="6" text-anchor="middle">FLUIDHONOR</text>

    <!-- Bronze Right Accent Line -->
    <line x1="120" y1="0" x2="190" y2="0" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
    <circle cx="190" cy="0" r="2.5" fill="#f59e0b" />
  </g>
</svg>
