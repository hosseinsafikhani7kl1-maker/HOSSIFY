<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="100%" height="100%">
  <defs>
    <linearGradient id="hseDarkBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="50%" stop-color="#060911" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <!-- Glowing Deep Blue Center Panel Gradient -->
    <linearGradient id="deepBlueOpsPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19284f" />
      <stop offset="50%" stop-color="#121d3b" />
      <stop offset="100%" stop-color="#0c142b" />
    </linearGradient>

    <!-- Active Glow Grid Item -->
    <linearGradient id="activeBlueGrid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <filter id="softOpsGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Frame & Dark Background -->
  <rect width="360" height="760" rx="36" fill="url(#hseDarkBg2)" stroke="#1e293b" stroke-width="3" />

  <!-- Top Status Bar -->
  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    <text x="24" y="28" font-weight="bold">14:25</text>
    <path d="M 280,20 L 290,20 L 285,14 Z M 300,20 L 310,20 M 320,18 L 332,18" stroke="#94a3b8" stroke-width="1.5" />
    <text x="336" y="28" text-anchor="end" font-weight="bold">91%</text>
  </g>

  <!-- Top App Navigation Bar -->
  <g transform="translate(16, 42)">
    <!-- Burger Menu -->
    <rect width="36" height="36" rx="10" fill="#131c2e" stroke="#1e2d4a" stroke-width="1" />
    <line x1="10" y1="13" x2="26" y2="13" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="18" x2="26" y2="18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="23" x2="26" y2="23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- App Logo & Title -->
    <g transform="translate(48, 0)">
      <rect width="36" height="36" rx="10" fill="#2563eb" />
      <text x="18" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="11" text-anchor="middle">HSE</text>
      
      <text x="46" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">HSE Core</text>
      <text x="46" y="29" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5">Safety, Health &amp; Environment</text>
    </g>

    <!-- Top Action Icon -->
    <rect x="290" y="0" width="36" height="36" rx="10" fill="#131c2e" stroke="#1e2d4a" stroke-width="1" />
    <rect x="302" y="10" width="12" height="16" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="305" y1="15" x2="311" y2="15" stroke="#94a3b8" stroke-width="1.5" />
  </g>

  <!-- Main Operations Dashboard Card -->
  <g transform="translate(16, 96)" filter="url(#softOpsGlow)">
    <rect width="328" height="535" rx="22" fill="url(#deepBlueOpsPanel)" stroke="#23386b" stroke-width="1.5" />
    
    <!-- Top Standards Badge Pill -->
    <g transform="translate(164, 20)">
      <rect x="-95" y="0" width="190" height="26" rx="13" fill="#0f1f42" stroke="#2563eb" stroke-width="1" />
      <circle cx="-76" cy="13" r="4.5" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <text x="10" y="17" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">استاندارد جامع ISO 45001 &amp; ISO 14001</text>
    </g>

    <!-- Operations Title -->
    <text x="164" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" text-anchor="middle">مدیریت عملیات HSE</text>
    
    <!-- Operations Description -->
    <text x="164" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">سیستم جامع یکپارچه گزارش‌دهی حوادث، بازرسی‌های ارگونومی،</text>
    <text x="164" y="114" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">ارزیابی ریسک، اقدامات اصلاحی و داشبورد مدیریتی Rig و حفاری و</text>
    <text x="164" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">تاسیسات پالایشگاهی</text>

    <!-- Pill Action Buttons -->
    <g transform="translate(24, 146)">
      <!-- Right Pill: View Reports -->
      <rect x="156" y="0" width="124" height="34" rx="17" fill="#20305a" stroke="#2c4480" stroke-width="1" />
      <text x="218" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">📊 چاپ گزارشات</text>

      <!-- Left Pill: Status -->
      <rect x="0" y="0" width="146" height="34" rx="17" fill="#18274d" stroke="#2563eb" stroke-width="1" />
      <text x="73" y="22" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">وضعیت محیط، ایمنی و بهداشت</text>
    </g>

    <!-- Grid Menu of Operations (2 Columns x 5 Rows) -->
    <g transform="translate(18, 196)">
      
      <!-- Row 1 -->
      <!-- Left: Incidents (حوادث و شبه‌حوادث) -->
      <rect x="0" y="0" width="138" height="54" rx="12" fill="#101a33" stroke="#1d2e57" stroke-width="1" />
      <g transform="translate(69, 22)">
        <polygon points="0,-12 12,8 -12,8" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <text x="0" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">حوادث و شبه‌حوادث</text>
      </g>

      <!-- Right: Active Dashboard Tab (داشبورد) -->
      <rect x="152" y="0" width="138" height="54" rx="12" fill="url(#activeBlueGrid)" stroke="#60a5fa" stroke-width="1.2" />
      <g transform="translate(221, 22)">
        <rect x="-10" y="-8" width="4" height="12" rx="1" fill="#ffffff" />
        <rect x="-3" y="-12" width="4" height="16" rx="1" fill="#ffffff" />
        <rect x="4" y="-5" width="4" height="9" rx="1" fill="#ffffff" />
        <text x="0" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">داشبورد</text>
      </g>

      <!-- Row 2 -->
      <!-- Left: HSE Inspections (بازرسی‌های HSE) -->
      <rect x="0" y="62" width="138" height="54" rx="12" fill="#101a33" stroke="#1d2e57" stroke-width="1" />
      <g transform="translate(69, 84)">
        <rect x="-8" y="-10" width="16" height="16" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <text x="0" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">بازرسی‌های HSE</text>
      </g>

      <!-- Right: Hazards & Actions (خطرات و علل بحران) -->
      <rect x="152" y="62" width="138" height="54" rx="12" fill="#101a33" stroke="#1d2e57" stroke-width="1" />
      <g transform="translate(221, 84)">
        <circle cx="0" cy="-2" r="8" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <text x="0" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">خطرات و علل بحران</text>
      </g>

      <!-- Row 3 -->
      <!-- Left: Risk Evaluation (ارزیابی ریسک و JSA) -->
      <rect x="0" y="124" width="138" height="54" rx="12" fill="#101a33" stroke="#1d2e57" stroke-width="1" />
      <g transform="translate(69, 146)">
        <path d="M 0,-10 L 8,-6 L 8,2 C 8,8 0,11 0,11 C 0,11 -8,8 -8,2 L -8,-6 Z" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <text x="0" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">ارزیابی ریسک و JSA</text>
      </g>

      <!-- Right: Ergonomics (عوامل ارگونومی) -->
      <rect x="152" y="124" width="138" height="54" rx="12" fill="#101a33" stroke="#1d2e57" stroke-width="1" />
      <g transform="translate(221, 146)">
        <circle cx="0" cy="-2" r="8" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <path d="M -4,-2 L -1,1 L 4,-4" stroke="#94a3b8" stroke-width="1.5" fill="none" />
        <text x="0" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">عوامل ارگونومی</text>
      </g>

      <!-- Row 4 -->
      <!-- Left: Standards (استانداردها) -->
      <rect x="0" y="186" width="138" height="54" rx="12" fill="#101a33" stroke="#1d2e57" stroke-width="1" />
      <g transform="translate(69, 208)">
        <circle cx="0" cy="-4" r="6" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <path d="M -4,2 L -6,10 L 0,7 L 6,10 L 4,2" fill="none" stroke="#94a3b8" stroke-width="1.2" />
        <text x="0" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">استانداردها</text>
      </g>

      <!-- Right: Toolbox Talks (جلسات ایمنی Toolbox) -->
      <rect x="152" y="186" width="138" height="54" rx="12" fill="#101a33" stroke="#1d2e57" stroke-width="1" />
      <g transform="translate(221, 208)">
        <rect x="-8" y="-8" width="16" height="12" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <text x="0" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">جلسات ایمنی (Toolbox)</text>
      </g>

      <!-- Row 5 -->
      <!-- Left: Users & Access (کاربران و دسترسی‌ها) -->
      <rect x="0" y="248" width="138" height="54" rx="12" fill="#101a33" stroke="#1d2e57" stroke-width="1" />
      <g transform="translate(69, 270)">
        <circle cx="-4" cy="-4" r="4" fill="none" stroke="#94a3b8" stroke-width="1.2" />
        <circle cx="4" cy="-4" r="4" fill="none" stroke="#94a3b8" stroke-width="1.2" />
        <text x="0" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">کاربران و دسترسی‌ها</text>
      </g>

      <!-- Right: Notifications (اعلان‌ها) -->
      <rect x="152" y="248" width="138" height="54" rx="12" fill="#101a33" stroke="#1d2e57" stroke-width="1" />
      <g transform="translate(221, 270)">
        <path d="M -4,-8 C -4,-10 4,-10 4,-8 C 4,-4 7,0 7,4 L -7,4 C -7,0 -4,-4 -4,-8 Z" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <text x="0" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">اعلان‌ها</text>
      </g>
    </g>
  </g>

  <!-- Bottom Dark Banner (HSE Management KPI Dashboard) -->
  <g transform="translate(16, 646)">
    <rect width="328" height="62" rx="14" fill="#0f1524" stroke="#1e293b" stroke-width="1" />
    <g transform="translate(16, 14)">
      <rect width="78" height="34" rx="10" fill="#1c2438" />
      <text x="39" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">خدمات واقعی و</text>
      <text x="39" y="31" fill="#64748b" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">عملیاتی دکل</text>

      <text x="210" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">داشبورد مدیریتی HSE</text>
      <text x="210" y="33" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">(شاخص‌های کلیدی عملکرد)</text>
    </g>
  </g>

  <!-- Bottom Home Indicator -->
  <rect x="130" y="744" width="100" height="4" rx="2" fill="#475569" />
</svg>
