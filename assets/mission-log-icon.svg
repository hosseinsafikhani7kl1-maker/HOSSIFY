<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow & Deep Space Radial Gradient -->
    <radialGradient id="deepMapBg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0e2a38" />
      <stop offset="45%" stop-color="#081824" />
      <stop offset="85%" stop-color="#040b12" />
      <stop offset="100%" stop-color="#010408" />
    </radialGradient>

    <!-- Warm Glowing Golden Rim Gradient -->
    <linearGradient id="goldRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="30%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <!-- Pin Outer Orange Metal Gradient -->
    <linearGradient id="pinOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="25%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <!-- Pin Inner Core Dark Oil Blue Gradient -->
    <radialGradient id="pinCoreGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#164e63" />
      <stop offset="70%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#031525" />
    </radialGradient>

    <!-- Orange Curved Route Arrow Gradient -->
    <linearGradient id="routeArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Green Success Badge Gradient -->
    <linearGradient id="successGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="60%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Soft Ambient Filters -->
    <filter id="goldenAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle Background with Glowing Golden/Orange Border -->
  <!-- Outer Glow Shadow -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#f97316" opacity="0.15" filter="url(#goldenAura)" />
  <!-- Main Background Container -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#deepMapBg)" stroke="url(#goldRimGrad)" stroke-width="6" />
  
  <!-- Subtle Top-Left Inner Specular Reflection -->
  <path d="M 28,124 C 28,68 68,28 124,28 L 388,28 C 340,36 120,40 40,140 Z" fill="#ffffff" opacity="0.08" />

  <!-- Background Oilfield GPS Coordinate Grid Lines -->
  <g stroke="#0284c7" stroke-width="1.2" opacity="0.22" stroke-dasharray="3 4">
    <!-- Grid Curves / Lat-Long Lines -->
    <line x1="60" y1="120" x2="452" y2="120" />
    <line x1="40" y1="240" x2="472" y2="240" />
    <line x1="60" y1="360" x2="452" y2="360" />
    
    <line x1="120" y1="60" x2="120" y2="452" />
    <line x1="240" y1="40" x2="240" y2="472" />
    <line x1="360" y1="60" x2="360" y2="452" />

    <!-- Plus Target Crosshairs -->
    <path d="M 110,240 L 130,240 M 120,230 L 120,250" stroke-width="1.5" />
    <path d="M 350,360 L 370,360 M 360,350 L 360,370" stroke-width="1.5" />
    <path d="M 350,120 L 370,120 M 360,110 L 360,130" stroke-width="1.5" />
  </g>

  <!-- Circular Curved Route Track Under the Pin -->
  <g filter="url(#badgeShadow)">
    <!-- Outer Track Arch Band -->
    <path d="M 180,390 C 130,370 100,315 105,250 C 110,195 150,150 200,135" fill="none" stroke="#7c2d12" stroke-width="32" stroke-linecap="round" />
    <path d="M 180,390 C 130,370 100,315 105,250 C 110,195 150,150 200,135" fill="none" stroke="url(#routeArrowGrad)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Track Waypoint Dots -->
    <g fill="#fed7aa" opacity="0.85">
      <circle cx="128" cy="340" r="4.5" />
      <circle cx="112" cy="285" r="4.5" />
      <circle cx="118" cy="225" r="4.5" />
      <circle cx="145" cy="175" r="4.5" />
    </g>

    <!-- Upward Curved Arrow Head (Exiting Pin) -->
    <path d="M 330,295 C 370,270 388,215 372,175" fill="none" stroke="url(#routeArrowGrad)" stroke-width="26" stroke-linecap="round" />
    <!-- Arrowhead Triangle -->
    <polygon points="360,150 395,190 345,185" fill="#fb923c" stroke="#9a3412" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Central Oil Rig Location Pin (GPS Marker with Integrated Derrick & Oil Drop) -->
  <g filter="url(#badgeShadow)" transform="translate(0, -5)">
    <!-- Outer Orange Pin Body -->
    <!-- Pin Head & Bottom Tip Point -->
    <path d="M 256,120 C 190,120 145,170 145,236 C 145,305 240,400 256,415 C 272,400 367,305 367,236 C 367,170 322,120 256,120 Z"
          fill="url(#pinOrangeGrad)" stroke="#7c2d12" stroke-width="4" />

    <!-- 3D Bevel Highlight Edge -->
    <path d="M 256,126 C 196,126 153,172 153,236 C 153,298 238,386 256,402 C 274,386 359,298 359,236 C 359,172 316,126 256,126 Z"
          fill="none" stroke="#fed7aa" stroke-width="3" opacity="0.6" />

    <!-- Circuit Trace Lines on Pin Body (Digital Mission OS Motif) -->
    <g stroke="#9a3412" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.65">
      <path d="M 230,365 L 230,335 L 210,315 L 185,315" />
      <circle cx="185" cy="315" r="3" fill="#fed7aa" />
      <path d="M 245,380 L 245,355 L 265,335" />
      <circle cx="265" cy="335" r="3" fill="#fed7aa" />
    </g>

    <!-- Inner Blue Core Disc in Pin -->
    <circle cx="256" cy="236" r="82" fill="url(#pinCoreGrad)" stroke="#7c2d12" stroke-width="4" />
    <circle cx="256" cy="236" r="80" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.4" />

    <!-- White & Metal Oil Drilling Derrick Rig (Tower) -->
    <g transform="translate(256, 238)">
      <!-- Derrick Crown / Top Block -->
      <polygon points="-8,-48 8,-48 12,-38 -12,-38" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
      <line x1="0" y1="-56" x2="0" y2="-48" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="-56" r="3.5" fill="#f59e0b" />

      <!-- Main Derrick Lattice Legs -->
      <polygon points="-12,-38 12,-38 28,34 -28,34" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" />
      
      <!-- Derrick Internal X-Bracing Girders -->
      <g stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round">
        <!-- Horizontal Beams -->
        <line x1="-14" y1="-20" x2="14" y2="-20" />
        <line x1="-19" y1="-2" x2="19" y2="-2" />
        <line x1="-24" y1="16" x2="24" y2="16" />

        <!-- X Crossings -->
        <line x1="-12" y1="-38" x2="14" y2="-20" />
        <line x1="12" y1="-38" x2="-14" y2="-20" />
        
        <line x1="-14" y1="-20" x2="19" y2="-2" />
        <line x1="14" y1="-20" x2="-19" y2="-2" />
        
        <line x1="-19" y1="-2" x2="24" y2="16" />
        <line x1="19" y1="-2" x2="-24" y2="16" />
      </g>

      <!-- Substructure Base Platform -->
      <rect x="-34" y="34" width="68" height="8" rx="2" fill="#e2e8f0" stroke="#334155" stroke-width="1.5" />

      <!-- Oil Drop Icon to the Right of Derrick -->
      <g transform="translate(32, -8)">
        <path d="M 0,-16 C 0,-16 -12,0 -12,8 C -12,15 -6,20 0,20 C 6,20 12,15 12,8 C 12,0 0,-16 0,-16 Z"
              fill="url(#pinOrangeGrad)" stroke="#7c2d12" stroke-width="1.5" />
        <!-- Drop Highlight -->
        <path d="M -4,4 C -4,0 -2,-6 0,-10 C -4,-6 -8,0 -8,7 C -8,11 -6,14 -4,16 C -6,14 -7,10 -4,4 Z" fill="#ffffff" opacity="0.6" />
      </g>
    </g>
  </g>

  <!-- Green Success / Approved Verification Badge in Top Right of Pin -->
  <g transform="translate(378, 142)" filter="url(#badgeShadow)">
    <!-- Badge Outer Border Disc -->
    <circle cx="0" cy="0" r="46" fill="#042f14" stroke="#4ade80" stroke-width="3" />
    <circle cx="0" cy="0" r="42" fill="url(#successGreen)" stroke="#14532d" stroke-width="2" />
    
    <!-- White Checkmark Symbol -->
    <path d="M -20,0 L -6,15 L 22,-14" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
