<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="goldButtonGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#131d2e" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="380" height="780" rx="36" fill="url(#bgGrad2)" stroke="#334155" stroke-width="4" />

  <!-- Status Bar -->
  <text x="30" y="24" fill="#cbd5e1" font-size="11" font-family="sans-serif" font-weight="bold">11:11</text>
  <text x="350" y="24" text-anchor="end" fill="#cbd5e1" font-size="11" font-family="sans-serif">4G  100% 🔋</text>

  <!-- Top App Navigation Header -->
  <g transform="translate(18, 40)">
    <!-- Search Button -->
    <rect x="0" y="0" width="38" height="38" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="17" cy="17" r="6" fill="none" stroke="#94a3b8" stroke-width="2" />
    <line x1="22" y1="22" x2="27" y2="27" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- App Brand Pill with Hamburger Menu -->
    <g transform="translate(244, 0)">
      <rect width="100" height="38" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="54" y="24" text-anchor="end" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="bold">نفت آموز</text>
      <!-- Gold Menu Icon -->
      <rect x="62" y="6" width="28" height="26" rx="8" fill="#f59e0b" />
      <line x1="68" y1="14" x2="84" y2="14" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
      <line x1="68" y1="19" x2="84" y2="19" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
      <line x1="68" y1="24" x2="84" y2="24" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Section Title -->
  <text x="344" y="120" text-anchor="end" fill="#f8fafc" font-size="17" font-family="sans-serif" font-weight="900">رشته‌های تخصصی صنعت نفت و گاز</text>
  <text x="344" y="142" text-anchor="end" fill="#94a3b8" font-size="9.5" font-family="sans-serif">دسترسی به ۱۳ شاخه تخصصی مهندسی، پالایش، مخزن، ابزار دقیق و بهره‌برداری همراه با آخرین دوره‌ها</text>

  <!-- Card 1: Petroleum Engineering -->
  <g transform="translate(18, 168)">
    <rect width="344" height="280" rx="24" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1" />

    <!-- Badge Left -->
    <rect x="20" y="20" width="100" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="70" y="36" text-anchor="middle" fill="#94a3b8" font-size="9.5">مقدماتی تا پیشرفته</text>

    <!-- Icon Right -->
    <g transform="translate(272, 18)">
      <rect width="52" height="52" rx="16" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
      <circle cx="26" cy="26" r="14" fill="none" stroke="#f59e0b" stroke-width="2" />
      <path d="M26,16 L29,26 L26,36 L23,26 Z" fill="#fbbf24" />
      <path d="M16,26 L26,29 L36,26 L26,23 Z" fill="#fbbf24" />
    </g>

    <!-- Title & English Name -->
    <text x="256" y="86" text-anchor="end" fill="#f8fafc" font-size="15" font-weight="bold">مهندسی نفت</text>
    <text x="256" y="104" text-anchor="end" fill="#f59e0b" font-size="10" font-family="monospace">Petroleum Engineering</text>

    <!-- Description -->
    <text x="324" y="132" text-anchor="end" fill="#94a3b8" font-size="9.5" font-family="sans-serif">مسیر جامع تعلیم آکادمی صنعت نفت شامل اکتشاف، مهندسی مخزن، حفاری و</text>
    <text x="324" y="148" text-anchor="end" fill="#94a3b8" font-size="9.5" font-family="sans-serif">بهره‌برداری هیدروکربوری</text>

    <!-- Tags Row 1 -->
    <g transform="translate(0, 168)">
      <rect x="180" y="0" width="144" height="26" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="252" y="17" text-anchor="middle" fill="#cbd5e1" font-size="9">🎓 کارشناسی ارشد گرایش‌ها</text>

      <rect x="20" y="0" width="150" height="26" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="95" y="17" text-anchor="middle" fill="#cbd5e1" font-size="9">🛢️ کارشناسی ارشد بالادستی</text>
    </g>

    <!-- Tags Row 2 -->
    <g transform="translate(0, 200)">
      <rect x="160" y="0" width="164" height="26" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="242" y="17" text-anchor="middle" fill="#cbd5e1" font-size="9">⚙️ کارشناسی ارشد بهره‌برداری</text>
    </g>

    <!-- Footer of Card 1: Button + Active Courses -->
    <g transform="translate(20, 236)">
      <rect x="175" y="0" width="129" height="32" rx="16" fill="url(#goldButtonGrad2)" />
      <text x="240" y="20" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">مشاهده دوره‌ها  ←</text>

      <text x="0" y="20" fill="#94a3b8" font-size="10">📖 ۲ دوره آموزشی فعال</text>
    </g>
  </g>

  <!-- Card 2: Geology & Exploration -->
  <g transform="translate(18, 466)">
    <rect width="344" height="280" rx="24" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1" />

    <!-- Badge Left -->
    <rect x="20" y="20" width="100" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="70" y="36" text-anchor="middle" fill="#94a3b8" font-size="9.5">متوسط تا پیشرفته</text>

    <!-- Icon Right -->
    <g transform="translate(272, 18)">
      <rect width="52" height="52" rx="16" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
      <circle cx="26" cy="26" r="14" fill="none" stroke="#f59e0b" stroke-width="2" />
      <path d="M26,16 L29,26 L26,36 L23,26 Z" fill="#fbbf24" />
      <path d="M16,26 L26,29 L36,26 L26,23 Z" fill="#fbbf24" />
    </g>

    <!-- Title & English Name -->
    <text x="256" y="86" text-anchor="end" fill="#f8fafc" font-size="15" font-weight="bold">زمین‌شناسی و اکتشاف</text>
    <text x="256" y="104" text-anchor="end" fill="#f59e0b" font-size="10" font-family="monospace">Geology & Exploration</text>

    <!-- Description -->
    <text x="324" y="132" text-anchor="end" fill="#94a3b8" font-size="9.5" font-family="sans-serif">مطالعه ساختارهای زیرسطحی، لرزه‌نگاری، تخمین نفتی و ارزیابی ریسک مخازن</text>
    <text x="324" y="148" text-anchor="end" fill="#94a3b8" font-size="9.5" font-family="sans-serif">زیرسطحی</text>

    <!-- Tags Row 1 -->
    <g transform="translate(0, 168)">
      <rect x="180" y="0" width="144" height="26" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="252" y="17" text-anchor="middle" fill="#cbd5e1" font-size="9">⛰️ زمین‌شناسی نفت</text>

      <rect x="20" y="0" width="150" height="26" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="95" y="17" text-anchor="middle" fill="#cbd5e1" font-size="9">🔍 کاربردی اکتشاف</text>
    </g>

    <!-- Footer of Card 2 -->
    <g transform="translate(20, 236)">
      <rect x="175" y="0" width="129" height="32" rx="16" fill="url(#goldButtonGrad2)" />
      <text x="240" y="20" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">مشاهده دوره‌ها  ←</text>

      <text x="0" y="20" fill="#94a3b8" font-size="10">📖 ۲ دوره آموزشی فعال</text>
    </g>
  </g>
</svg>
