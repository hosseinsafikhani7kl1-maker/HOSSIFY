<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fhDarkBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="30%" stop-color="#0b1020" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Flowchart Card Background -->
    <linearGradient id="flowCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0e1424" stop-opacity="0.95" />
    </linearGradient>

    <!-- Orange Gradient Button -->
    <linearGradient id="orangeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Device Background -->
  <rect width="380" height="780" rx="36" fill="url(#fhDarkBg3)" stroke="#1e293b" stroke-width="4" />

  <!-- Top App Header -->
  <g transform="translate(18, 16)">
    <!-- Globe Icon (Language) -->
    <circle cx="20" cy="18" r="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="22" fill="#94a3b8" font-size="12" text-anchor="middle">🌐</text>
    <text x="20" y="36" fill="#64748b" font-family="'Vazirmatn', system-ui, sans-serif" font-size="8" text-anchor="middle">زبان</text>

    <!-- Center App Title -->
    <text x="172" y="24" fill="#ffffff" font-family="'Arial Black', system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="1.5" text-anchor="middle">FLUIDHONOR</text>

    <!-- Orange Pulse/Wave Icon Button -->
    <rect x="296" y="2" width="34" height="34" rx="10" fill="url(#orangeGrad3)" />
    <path d="M 302,19 L 310,19 L 314,8 L 318,30 L 322,14 L 326,19 L 330,19" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Date Subtitle Header -->
  <g transform="translate(190, 84)">
    <text x="0" y="0" fill="#94a3b8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="11" text-anchor="middle">۱۴۰۲ مرداد ۱۳ - دوشنبه</text>
    <circle cx="0" cy="12" r="2" fill="#475569" />
  </g>

  <!-- Section Title -->
  <g transform="translate(18, 126)">
    <text x="344" y="16" fill="#cbd5e1" font-family="'Vazirmatn', system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="end">سیستم تجهیزات و Packing و Stripper</text>
    <rect x="320" y="-3" width="26" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <path d="M 327,10 L 333,16 L 339,6" fill="none" stroke="#34d399" stroke-width="2" />
  </g>

  <!-- ================= TOP INTERACTIVE FLOWCHART CARD ================= -->
  <g transform="translate(16, 172)">
    <rect x="0" y="0" width="348" height="200" rx="18" fill="url(#flowCardGrad)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Flowchart Guide Instructions (Orange Note) -->
    <text x="174" y="36" fill="#f59e0b" font-family="'Vazirmatn', system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">فلوچارت عیب‌یابی (جهت بررسی دقیق‌تر روی مستطیل‌ها کلیک کنید)</text>

    <!-- Orange Decision Rectangular Box -->
    <g transform="translate(36, 68)">
      <rect x="0" y="0" width="276" height="68" rx="12" fill="url(#orangeGrad3)" stroke="#b45309" stroke-width="1" />
      <text x="138" y="40" fill="#ffffff" font-family="'Vazirmatn', system-ui, sans-serif" font-weight="900" font-size="13" text-anchor="middle">آیا فشار هیدرولیک به پکینگ اعمال می‌شود؟</text>
    </g>

    <!-- Branch Flow Lines Below -->
    <g transform="translate(16, 172)">
      <line x1="16" y1="0" x2="150" y2="0" stroke="#334155" stroke-width="2" />
      <line x1="166" y1="0" x2="300" y2="0" stroke="#334155" stroke-width="2" />
    </g>
  </g>

  <!-- ================= BOTTOM FAULT DETAIL CARD (#12) ================= -->
  <g transform="translate(16, 396)">
    <rect x="0" y="0" width="348" height="300" rx="18" fill="url(#flowCardGrad)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Bookmark Button on Left -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <path d="M 11,8 L 23,8 L 23,26 L 17,20 L 11,26 Z" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    </g>

    <!-- Fault Title in Persian -->
    <text x="328" y="38" fill="#f59e0b" font-family="'Vazirmatn', system-ui, sans-serif" font-weight="900" font-size="15" text-anchor="end">۱۲. قفل شدن مکانیکی پکینگ استریپر</text>

    <!-- Fault Title in English -->
    <text x="328" y="66" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="end">Stripper Rubber Mechanical)</text>
    <text x="328" y="86" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="end">(Jam</text>

    <!-- Inner Dark Symptom Sub-Card -->
    <g transform="translate(24, 116)">
      <rect x="0" y="0" width="300" height="158" rx="12" fill="#090d16" stroke="#1f2937" stroke-width="1" />

      <!-- Red Accent Bar & Tag Header -->
      <rect x="278" y="14" width="4" height="18" rx="2" fill="#ef4444" />
      <text x="268" y="28" fill="#cbd5e1" font-family="'Vazirmatn', system-ui, sans-serif" font-weight="800" font-size="12" text-anchor="end">عیب (Symptom)</text>

      <!-- Detailed Description Text in Green/Cyan -->
      <g transform="translate(278, 56)" font-family="'Vazirmatn', system-ui, sans-serif" font-size="12" font-weight="600" fill="#34d399">
        <text x="0" y="0" text-anchor="end">لوله گیر کرده است یا ضخامت لوله (مانند Roll-On</text>
        <text x="0" y="24" text-anchor="end">Connector یا ابزار BHA) نمی‌تواند از داخل استریپر عبور</text>
        <text x="0" y="48" text-anchor="end">کند، با وجود اینکه فشار هیدرولیک استریپر کاملاً تخلیه شده</text>
        <text x="0" y="72" text-anchor="end">است.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(10, 715)">
    <rect width="360" height="54" rx="20" fill="#0c1220" stroke="#1e293b" stroke-width="1" />

    <!-- Camera/Diagram -->
    <g transform="translate(24, 27)">
      <rect x="-8" y="-6" width="16" height="14" rx="2" fill="none" stroke="#64748b" stroke-width="1.5" />
      <circle cx="0" cy="1" r="3" fill="none" stroke="#64748b" stroke-width="1.5" />
    </g>

    <!-- Chart -->
    <g transform="translate(68, 27)">
      <rect x="-5" y="-3" width="2" height="10" fill="#64748b" />
      <rect x="-1" y="-8" width="2" height="15" fill="#64748b" />
      <rect x="3" y="-5" width="2" height="12" fill="#64748b" />
    </g>

    <!-- Rotate/Flow -->
    <g transform="translate(112, 27)">
      <circle cx="0" cy="0" r="7" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="10 5" />
    </g>

    <!-- Speedometer -->
    <g transform="translate(156, 27)">
      <path d="M -7,3 A 8 8 0 1 1 7,3" fill="none" stroke="#64748b" stroke-width="1.5" />
    </g>

    <!-- Terminal Prompt -->
    <g transform="translate(200, 27)">
      <path d="M -4,-4 L 1,0 L -4,4" fill="none" stroke="#64748b" stroke-width="1.5" />
      <line x1="3" y1="4" x2="7" y2="4" stroke="#64748b" stroke-width="1.5" />
    </g>

    <!-- Layout Window -->
    <g transform="translate(244, 27)">
      <rect x="-8" y="-7" width="16" height="14" rx="2" fill="none" stroke="#64748b" stroke-width="1.5" />
      <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#64748b" stroke-width="1" />
    </g>

    <!-- Pulse (Active View) -->
    <g transform="translate(288, 27)">
      <path d="M -8,0 L -4,0 L -2,-6 L 2,6 L 4,-2 L 6,0 L 8,0" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Bookmark -->
    <g transform="translate(332, 27)">
      <path d="M -5,-7 L 5,-7 L 5,7 L 0,3 L -5,7 Z" fill="none" stroke="#64748b" stroke-width="1.5" />
    </g>
  </g>
</svg>
