<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="100%" height="100%">
  <defs>
    <linearGradient id="hseDarkBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="50%" stop-color="#060911" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <!-- Warm Warning Box Gradient -->
    <linearGradient id="warmWarningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Orange Gradient Button for Active Training Dashboard -->
    <linearGradient id="orangeAcademyBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <filter id="softAcademyGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Device Frame & Dark Background -->
  <rect width="360" height="760" rx="36" fill="url(#hseDarkBg3)" stroke="#1e293b" stroke-width="3" />

  <!-- Top Status Bar -->
  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    <text x="24" y="28" font-weight="bold">14:24</text>
    <path d="M 280,20 L 290,20 L 285,14 Z M 300,20 L 310,20 M 320,18 L 332,18" stroke="#94a3b8" stroke-width="1.5" />
    <text x="336" y="28" text-anchor="end" font-weight="bold">92%</text>
  </g>

  <!-- Top App Navigation Bar -->
  <g transform="translate(16, 42)">
    <!-- Burger Menu -->
    <rect width="36" height="36" rx="10" fill="#131c2e" stroke="#1e2d4a" stroke-width="1" />
    <line x1="10" y1="13" x2="26" y2="13" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="18" x2="26" y2="18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="23" x2="26" y2="23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- App Logo & Title -->
    <g transform="translate(48, 0)">
      <rect width="36" height="36" rx="10" fill="#2563eb" />
      <text x="18" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="11" text-anchor="middle">HSE</text>
      
      <text x="46" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">HSE Core</text>
      <text x="46" y="29" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5">Safety, Health &amp; Environment</text>
    </g>

    <!-- Online Status Dot -->
    <circle cx="312" cy="18" r="5" fill="#10b981" />
  </g>

  <!-- Main Academy Hero Header Panel -->
  <g transform="translate(16, 96)" filter="url(#softAcademyGlow)">
    <rect width="328" height="280" rx="20" fill="#0f1523" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Top Yellow Tag -->
    <g transform="translate(24, 20)">
      <text x="10" y="15" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">ISO 45001 / OSHA / IOGP</text>
      <rect x="126" y="0" width="138" height="24" rx="4" fill="#facc15" />
      <text x="195" y="16" fill="#713f12" font-family="system-ui, sans-serif" font-weight="bold" font-size="8.5" text-anchor="middle">HSE ACADEMY &amp; TRAINING CENTER</text>
    </g>

    <!-- Book Icon -->
    <g transform="translate(270, 20)">
      <rect width="34" height="34" rx="10" fill="#f59e0b" />
      <text x="17" y="23" fill="#ffffff" font-size="16" text-anchor="middle">📖</text>
    </g>

    <!-- Title of Academy -->
    <text x="164" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">مرکز جامع آموزش و یادگیری تئوری HSE</text>
    <text x="164" y="98" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">(کارگران، تکنسین‌ها و سرپرستان)</text>

    <!-- Training Buttons Matrix -->
    <g transform="translate(16, 118)">
      <!-- Row 1 -->
      <!-- Right: Active Training Dashboard -->
      <rect x="148" y="0" width="144" height="34" rx="12" fill="url(#orangeAcademyBtn)" />
      <text x="220" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="10.5" text-anchor="middle">📊 داشبورد آموزش</text>

      <!-- Left: Courses (۱۲ دوره) -->
      <rect x="0" y="0" width="140" height="34" rx="12" fill="#141c2c" stroke="#1f293d" stroke-width="1" />
      <text x="70" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">📚 دوره‌ها (12)</text>

      <!-- Row 2 -->
      <!-- Right: Flashcards -->
      <rect x="148" y="42" width="144" height="34" rx="12" fill="#141c2c" stroke="#1f293d" stroke-width="1" />
      <text x="220" y="63" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">👥 دوره‌های شاغلی</text>

      <!-- Left: TBT Talks -->
      <rect x="0" y="42" width="140" height="34" rx="12" fill="#141c2c" stroke="#1f293d" stroke-width="1" />
      <text x="70" y="63" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">⚡ آموزش‌های کوتاه TBT</text>

      <!-- Row 3 -->
      <!-- Right: Glossary -->
      <rect x="148" y="84" width="144" height="34" rx="12" fill="#141c2c" stroke="#1f293d" stroke-width="1" />
      <text x="220" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">📖 دانشنامه HSE</text>

      <!-- Left: Flashcards -->
      <rect x="0" y="84" width="140" height="34" rx="12" fill="#141c2c" stroke="#1f293d" stroke-width="1" />
      <text x="70" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">🔄 فلش‌کارت‌ها</text>

      <!-- Row 4 -->
      <!-- Right: Certificates -->
      <rect x="148" y="126" width="144" height="34" rx="12" fill="#141c2c" stroke="#1f293d" stroke-width="1" />
      <text x="220" y="147" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">🏆 گواهینامه‌ها (3)</text>

      <!-- Left: Tests -->
      <rect x="0" y="126" width="140" height="34" rx="12" fill="#141c2c" stroke="#1f293d" stroke-width="1" />
      <text x="70" y="147" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">📝 آزمون بعدی</text>
    </g>
  </g>

  <!-- Yellow Training Notice Box -->
  <g transform="translate(16, 388)" filter="url(#softAcademyGlow)">
    <rect width="328" height="96" rx="16" fill="url(#warmWarningGrad)" stroke="#fde68a" stroke-width="1" />
    <g transform="translate(16, 14)">
      <!-- Triangle Warning Icon -->
      <text x="286" y="24" fill="#d97706" font-size="18" text-anchor="middle">⚠️</text>
      
      <!-- Warning Text Header -->
      <text x="264" y="16" fill="#92400e" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" text-anchor="end">هشدار ایمنی و آیین‌نامه اجباری:</text>
      
      <!-- Warning Text Body -->
      <text x="280" y="36" fill="#78350f" font-family="system-ui, sans-serif" font-size="9" text-anchor="end">محتوای این آکادمی صرفاً جهت ترفیع آگاهی تئوری بوده و به هیچ عنوان</text>
      <text x="280" y="52" fill="#78350f" font-family="system-ui, sans-serif" font-size="9" text-anchor="end">جایگزین دوره‌های عملی، گواهی‌نامه‌های رسمی، برگه‌های اطلاعات برگه</text>
      <text x="280" y="68" fill="#78350f" font-family="system-ui, sans-serif" font-size="9" text-anchor="end">اطلاعات ایمنی (SDS) و سرپرستی رسمی کار در شرایط پرخطر نمی‌باشد.</text>
    </g>
  </g>

  <!-- Metric Stat Cards (2x2 Grid) -->
  <g transform="translate(16, 498)">
    
    <!-- Stat 1: Completed Courses (دوره های تکمیل شده) -->
    <rect x="170" y="0" width="158" height="110" rx="16" fill="#ffffff" filter="url(#softAcademyGlow)" />
    <g transform="translate(180, 16)">
      <circle cx="12" cy="12" r="12" fill="#dcfce7" />
      <path d="M 8,12 L 11,15 L 17,9" stroke="#16a34a" stroke-width="2" fill="none" />
      <text x="136" y="14" fill="#71717a" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="end">دوره‌های تکمیل شده</text>
      <text x="136" y="52" fill="#09090b" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="end">3</text>
      <text x="136" y="78" fill="#16a34a" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" text-anchor="end">از ۱۲ دوره</text>
    </g>

    <!-- Stat 2: Mandatory Courses (دوره های اجباری) -->
    <rect x="0" y="0" width="158" height="110" rx="16" fill="#ffffff" filter="url(#softAcademyGlow)" />
    <g transform="translate(10, 16)">
      <circle cx="12" cy="12" r="12" fill="#fef3c7" />
      <circle cx="12" cy="12" r="6" fill="none" stroke="#d97706" stroke-width="2" />
      <text x="136" y="14" fill="#71717a" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">دوره‌های اجباری</text>
      <text x="136" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="end">(MANDATORY)</text>
      <text x="136" y="56" fill="#09090b" font-family="system-ui, sans-serif" font-weight="900" font-size="24" text-anchor="end">1 / 11</text>
      <text x="136" y="78" fill="#ea580c" font-family="system-ui, sans-serif" font-weight="bold" font-size="9.5" text-anchor="end">تکمیل شده</text>
    </g>

    <!-- Row 2 of Stats -->
    <!-- Stat 3: Average Score (میانگین نمره آزمون‌ها) -->
    <rect x="170" y="122" width="158" height="96" rx="16" fill="#ffffff" filter="url(#softAcademyGlow)" />
    <g transform="translate(180, 136)">
      <circle cx="12" cy="12" r="12" fill="#e0f2fe" />
      <text x="12" y="16" fill="#0284c7" font-size="10" text-anchor="middle">🏅</text>
      <text x="136" y="14" fill="#71717a" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="end">میانگین نمره آزمون‌ها</text>
      <text x="136" y="50" fill="#09090b" font-family="system-ui, sans-serif" font-weight="900" font-size="24" text-anchor="end">88.5%</text>
      <text x="136" y="70" fill="#0284c7" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="end">عالی</text>
    </g>

    <!-- Stat 4: Issued Certificates (گواهی‌نامه‌های صادر شده) -->
    <rect x="0" y="122" width="158" height="96" rx="16" fill="#ffffff" filter="url(#softAcademyGlow)" />
    <g transform="translate(10, 136)">
      <circle cx="12" cy="12" r="12" fill="#f3e8ff" />
      <text x="12" y="16" fill="#9333ea" font-size="10" text-anchor="middle">📜</text>
      <text x="136" y="14" fill="#71717a" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="end">گواهینامه‌های صادر شده</text>
      <text x="136" y="50" fill="#09090b" font-family="system-ui, sans-serif" font-weight="900" font-size="26" text-anchor="end">3</text>
      <text x="136" y="70" fill="#7e22ce" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="end">معتبر</text>
    </g>
  </g>

  <!-- Bottom Home Indicator -->
  <rect x="130" y="744" width="100" height="4" rx="2" fill="#475569" />
</svg>
