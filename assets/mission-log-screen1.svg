<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="100%" height="100%">
  <defs>
    <linearGradient id="mlBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091424" />
      <stop offset="50%" stop-color="#050b14" />
      <stop offset="100%" stop-color="#02050a" />
    </linearGradient>
    <linearGradient id="winCard1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122038" />
      <stop offset="100%" stop-color="#0a1220" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect width="360" height="760" rx="36" fill="url(#mlBg1)" stroke="#1e293b" stroke-width="3" />

  <!-- Status Bar -->
  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    <text x="24" y="28" font-weight="bold">09:41</text>
    <text x="336" y="28" text-anchor="end">4G 100%</text>
  </g>

  <!-- Top App Bar & Window Title -->
  <g transform="translate(20, 42)">
    <rect width="320" height="42" rx="12" fill="#0f1f38" stroke="#1e3a5f" stroke-width="1" />
    <!-- Window Traffic Lights -->
    <circle cx="20" cy="21" r="5" fill="#ef4444" />
    <circle cx="35" cy="21" r="5" fill="#f59e0b" />
    <circle cx="50" cy="21" r="5" fill="#10b981" />
    
    <text x="160" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">میز کار هوشمند • MISSION LOG OS</text>
    
    <!-- Multi-Window Icon -->
    <rect x="286" y="12" width="18" height="18" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="282" y="16" width="14" height="14" rx="3" fill="#0f1f38" stroke="#94a3b8" stroke-width="1.2" />
  </g>

  <!-- Operational Dashboard Metrics (4 Tiles) -->
  <g transform="translate(20, 96)">
    <!-- Tile 1: Active Missions -->
    <rect width="154" height="74" rx="12" fill="#0b1322" stroke="#38bdf8" stroke-width="1.2" />
    <g transform="translate(14, 14)">
      <circle cx="12" cy="12" r="12" fill="#0c4a6e" />
      <path d="M 8,12 L 11,15 L 16,9" stroke="#38bdf8" stroke-width="2" fill="none" />
      <text x="32" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">مأموریت‌های فعال</text>
      <text x="0" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="20">۱۲ <tspan font-size="11" fill="#38bdf8">پروژه</tspan></text>
    </g>

    <!-- Tile 2: Active Equipment -->
    <g transform="translate(166, 0)">
      <rect width="154" height="74" rx="12" fill="#0b1322" stroke="#10b981" stroke-width="1.2" />
      <g transform="translate(14, 14)">
        <circle cx="12" cy="12" r="12" fill="#064e3b" />
        <circle cx="12" cy="12" r="5" fill="#34d399" />
        <text x="32" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">تجهیزات عملیاتی</text>
        <text x="0" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="20">۴۸ <tspan font-size="11" fill="#34d399">دستگاه</tspan></text>
      </g>
    </g>
  </g>

  <!-- Live Multi-Window Active Missions Window -->
  <g transform="translate(20, 182)">
    <rect width="320" height="340" rx="16" fill="url(#winCard1)" stroke="#1e3a5f" stroke-width="1.2" />
    
    <g transform="translate(16, 16)">
      <!-- Window Subheader -->
      <g>
        <text x="0" y="14" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">لاگ‌شیت‌های زنده و لاگ مأموریت</text>
        <text x="288" y="14" text-anchor="end" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">پنجره فعال</text>
      </g>

      <!-- Mission List Item 1 -->
      <g transform="translate(0, 30)">
        <rect width="288" height="66" rx="10" fill="#08101c" stroke="#0284c7" stroke-width="1" />
        <g transform="translate(12, 12)">
          <rect x="0" y="2" width="6" height="38" rx="3" fill="#0284c7" />
          <text x="16" y="14" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">عملیات لوله‌مغزی چاه مارون-۱۸۴</text>
          <text x="16" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">پیمایش اسیدکاری • دکل ۳۴ فتح • ناظر: مهندس صفی‌خانی</text>
          <rect x="210" y="2" width="54" height="20" rx="6" fill="#0c4a6e" />
          <text x="237" y="16" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">در حال اجرا</text>
        </g>
      </g>

      <!-- Mission List Item 2 -->
      <g transform="translate(0, 106)">
        <rect width="288" height="66" rx="10" fill="#08101c" stroke="#1e293b" stroke-width="1" />
        <g transform="translate(12, 12)">
          <rect x="0" y="2" width="6" height="38" rx="3" fill="#10b981" />
          <text x="16" y="14" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">بازرسی فنی و تست فشار شیرهای BOP</text>
          <text x="16" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">فشار کاری: ۱۰,۰۰۰ psi • وضعیت: تاییدیه نهایی صادر شد</text>
          <rect x="210" y="2" width="54" height="20" rx="6" fill="#064e3b" />
          <text x="237" y="16" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">تکمیل شده</text>
        </g>
      </g>

      <!-- Mission List Item 3 -->
      <g transform="translate(0, 182)">
        <rect width="288" height="66" rx="10" fill="#08101c" stroke="#1e293b" stroke-width="1" />
        <g transform="translate(12, 12)">
          <rect x="0" y="2" width="6" height="38" rx="3" fill="#f59e0b" />
          <text x="16" y="14" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">سرویس دوره‌ای پمپ‌تراک هیدرولیک #۲</text>
          <text x="16" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">تعویض پکینگ و اورهال سیستم روانکاری • کارگاه مرکزی</text>
          <rect x="210" y="2" width="54" height="20" rx="6" fill="#78350f" />
          <text x="237" y="16" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">برنامه‌ریزی</text>
        </g>
      </g>

      <!-- Quick Action / Add Log -->
      <g transform="translate(0, 258)">
        <rect width="288" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
        <text x="144" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="11.5" text-anchor="middle">+ ثبت لاگ‌شیت عملیاتی جدید (New Mission Log)</text>
      </g>
    </g>
  </g>

  <!-- Bottom OS Dock Bar (Desktop Style Taskbar) -->
  <g transform="translate(20, 536)">
    <rect width="320" height="58" rx="16" fill="#070f1e" stroke="#1e3a5f" stroke-width="1.5" />
    
    <g transform="translate(24, 12)">
      <!-- Start Button -->
      <rect x="0" y="2" width="30" height="30" rx="8" fill="#0284c7" />
      <g fill="#ffffff">
        <rect x="6" y="8" width="7" height="7" rx="1" />
        <rect x="17" y="8" width="7" height="7" rx="1" />
        <rect x="6" y="19" width="7" height="7" rx="1" />
        <rect x="17" y="19" width="7" height="7" rx="1" />
      </g>

      <!-- App 1: Dashboard -->
      <rect x="54" y="2" width="30" height="30" rx="8" fill="#1e293b" />
      <circle cx="69" cy="17" r="6" fill="#38bdf8" />

      <!-- App 2: Calendar -->
      <rect x="108" y="2" width="30" height="30" rx="8" fill="#1e293b" />
      <rect x="114" y="8" width="18" height="18" rx="4" fill="none" stroke="#f59e0b" stroke-width="1.5" />

      <!-- App 3: Equipment -->
      <rect x="162" y="2" width="30" height="30" rx="8" fill="#1e293b" />
      <circle cx="177" cy="17" r="7" fill="none" stroke="#10b981" stroke-width="2" />

      <!-- App 4: Docs -->
      <rect x="216" y="2" width="30" height="30" rx="8" fill="#1e293b" />
      <path d="M 223,10 L 235,10 L 239,14 L 239,24 L 223,24 Z" fill="#6366f1" />
    </g>
  </g>
</svg>
