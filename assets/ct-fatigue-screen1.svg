<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091424" />
      <stop offset="50%" stop-color="#060c18" />
      <stop offset="100%" stop-color="#02060d" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132035" />
      <stop offset="100%" stop-color="#0b1322" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="warningGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Phone Screen Frame -->
  <rect width="360" height="760" rx="36" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3" />

  <!-- Status Bar -->
  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    <text x="24" y="28" font-weight="bold">11:20</text>
    <text x="336" y="28" text-anchor="end">4G 100%</text>
  </g>

  <!-- Top App Bar -->
  <g transform="translate(20, 42)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#132035" stroke="#1e3a5f" stroke-width="1" />
    <path d="M12,18 L24,18 M12,13 L24,13 M12,23 L24,23" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    
    <text x="160" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="15">CT-Fatigue Analyzer</text>
    
    <rect x="284" y="0" width="36" height="36" rx="10" fill="#132035" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="302" cy="18" r="6" fill="none" stroke="#94a3b8" stroke-width="2" />
  </g>

  <!-- Metric / Imperial Toggle Badge -->
  <g transform="translate(20, 90)">
    <rect width="320" height="36" rx="10" fill="#0b1322" stroke="#1e293b" stroke-width="1" />
    <rect x="3" y="3" width="154" height="30" rx="8" fill="#10b981" />
    <text x="80" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">استاندارد امپریال (psi / in / ft)</text>
    <text x="238" y="22" fill="#64748b" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">متریک (MPa / mm / m)</text>
  </g>

  <!-- Pipe Specs & Geometry Card -->
  <g transform="translate(20, 138)">
    <rect width="320" height="155" rx="16" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.2" />
    
    <g transform="translate(16, 16)">
      <circle cx="12" cy="12" r="10" fill="#064e3b" />
      <path d="M7,12 L11,16 L17,8" stroke="#34d399" stroke-width="1.8" fill="none" />
      <text x="32" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">مشخصات هندسی لوله‌مغزی و متریال</text>
      
      <!-- Input Grid 2x2 -->
      <!-- Item 1: Tubing OD -->
      <g transform="translate(0, 32)">
        <rect width="138" height="42" rx="8" fill="#091424" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">قطر خارجی (OD)</text>
        <text x="10" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">1.750 in (44.45 mm)</text>
      </g>
      
      <!-- Item 2: Wall Thickness -->
      <g transform="translate(150, 32)">
        <rect width="138" height="42" rx="8" fill="#091424" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">ضخامت جداره (Wall Thick)</text>
        <text x="10" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">0.134 in (3.40 mm)</text>
      </g>

      <!-- Item 3: Yield Strength -->
      <g transform="translate(0, 80)">
        <rect width="138" height="42" rx="8" fill="#091424" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">گرید فولاد (Yield Strength)</text>
        <text x="10" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">CT-80 (80,000 psi)</text>
      </g>
      
      <!-- Item 4: Reel Radius -->
      <g transform="translate(150, 80)">
        <rect width="138" height="42" rx="8" fill="#091424" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">شعاع قرقره (Reel Core)</text>
        <text x="10" y="32" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">48 in (Gooseneck: 72")</text>
      </g>
    </g>
  </g>

  <!-- Live Stress Analysis Results Card -->
  <g transform="translate(20, 305)">
    <rect width="320" height="205" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    
    <g transform="translate(16, 16)">
      <text x="0" y="14" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">تحلیل تنش چندمحوره (Multi-Axial Stress)</text>
      <text x="288" y="14" text-anchor="end" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">● زنده</text>

      <!-- Gauge 1: Von Mises Equivalent Stress -->
      <g transform="translate(0, 30)">
        <rect width="288" height="68" rx="10" fill="#07111e" stroke="#1e3a5f" stroke-width="1" />
        <text x="14" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">تنش معادل فون مایسز (Von Mises Stress)</text>
        <text x="14" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="20">54,820 <tspan font-size="12" fill="#38bdf8">psi</tspan></text>
        <text x="274" y="48" text-anchor="end" fill="#10b981" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">68.5% <tspan font-size="9" fill="#64748b">Yield</tspan></text>
        <!-- Progress Bar -->
        <rect x="14" y="56" width="260" height="4" rx="2" fill="#1e293b" />
        <rect x="14" y="56" width="178" height="4" rx="2" fill="url(#emeraldGrad)" />
      </g>

      <!-- Gauge 2: Hoop Stress (Internal Pressure: 4,500 psi) -->
      <g transform="translate(0, 106)">
        <rect width="288" height="68" rx="10" fill="#07111e" stroke="#1e3a5f" stroke-width="1" />
        <text x="14" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">تنش حلقوی هیدرولیکی (Hoop Stress @ 4500 psi)</text>
        <text x="14" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="20">29,420 <tspan font-size="12" fill="#f59e0b">psi</tspan></text>
        <text x="274" y="48" text-anchor="end" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">امن (Safe)</text>
        <!-- Progress Bar -->
        <rect x="14" y="56" width="260" height="4" rx="2" fill="#1e293b" />
        <rect x="14" y="56" width="130" height="4" rx="2" fill="url(#warningGrad)" />
      </g>
    </g>
  </g>

  <!-- Bottom Action Button -->
  <g transform="translate(20, 525)">
    <rect width="320" height="50" rx="14" fill="url(#emeraldGrad)" />
    <text x="160" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">محاسبه انباشت خستگی چرخه‌ای (Coffin-Manson) ←</text>
  </g>
</svg>
