<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Carbon fiber pattern -->
    <pattern id="carbonMesh" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#080b11" />
      <path d="M 0,0 L 6,6 L 0,12 Z" fill="#0f1520" />
      <path d="M 6,6 L 12,0 L 12,12 Z" fill="#141c2b" />
      <circle cx="3" cy="3" r="1.2" fill="#1e293b" opacity="0.6" />
      <circle cx="9" cy="9" r="1.2" fill="#1e293b" opacity="0.6" />
    </pattern>

    <!-- Glass Capsule Gradients -->
    <linearGradient id="glassRimCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="glassRimOrange" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7e00" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.1" />
    </linearGradient>

    <!-- Core Capsule Body -->
    <linearGradient id="capsuleCore" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#0a0f1d" stop-opacity="0.98" />
      <stop offset="70%" stop-color="#05070d" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Specular Glass Reflection Top Highlight -->
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#bae6fd" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonCyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonOrangeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeOuterShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base App Background with Diagonal Texture -->
  <rect width="512" height="512" rx="112" fill="url(#carbonMesh)" stroke="#1e293b" stroke-width="4" />

  <!-- Diagonal Carbon Fiber Ridges -->
  <g stroke="#05070c" stroke-width="7" opacity="0.7">
    <line x1="-100" y1="100" x2="600" y2="-600" />
    <line x1="-100" y1="150" x2="600" y2="-550" />
    <line x1="-100" y1="200" x2="600" y2="-500" />
    <line x1="-100" y1="250" x2="600" y2="-450" />
    <line x1="-100" y1="300" x2="600" y2="-400" />
    <line x1="-100" y1="350" x2="600" y2="-350" />
    <line x1="-100" y1="400" x2="600" y2="-300" />
    <line x1="-100" y1="450" x2="600" y2="-250" />
    <line x1="-100" y1="500" x2="600" y2="-200" />
    <line x1="-100" y1="550" x2="600" y2="-150" />
    <line x1="-100" y1="600" x2="600" y2="-100" />
  </g>

  <!-- Ambient Glow Behind Capsule -->
  <!-- Orange ambient right -->
  <circle cx="340" cy="180" r="140" fill="#f59e0b" opacity="0.22" filter="url(#neonOrangeGlow)" />
  <!-- Cyan ambient left -->
  <circle cx="180" cy="340" r="140" fill="#00f2fe" opacity="0.25" filter="url(#neonCyanGlow)" />

  <!-- 3D Rotated Isometric Glass Capsule -->
  <g transform="translate(256, 256) rotate(-38)" filter="url(#badgeOuterShadow)">
    
    <!-- Outer Metallic/Glass Rim Base -->
    <rect x="-140" y="-210" width="280" height="420" rx="140" fill="url(#capsuleCore)" />
    
    <!-- Bottom Left Cyan Neon Edge Ring -->
    <path d="M -140,70 A 140 140 0 0 0 70,210" fill="none" stroke="url(#glassRimCyan)" stroke-width="12" stroke-linecap="round" filter="url(#neonCyanGlow)" />
    <path d="M -136,60 A 136 136 0 0 0 60,206" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" />

    <!-- Top Right Orange Neon Edge Ring -->
    <path d="M 140,-70 A 140 140 0 0 0 -70,-210" fill="none" stroke="url(#glassRimOrange)" stroke-width="12" stroke-linecap="round" filter="url(#neonOrangeGlow)" />
    <path d="M 136,-60 A 136 136 0 0 0 -60,-206" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round" />

    <!-- Inner Floating Holographic Platform -->
    <!-- Perspective Ellipse Pedestal -->
    <ellipse cx="0" cy="65" rx="100" ry="40" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" filter="url(#neonCyanGlow)" />
    <ellipse cx="0" cy="65" rx="75" ry="28" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.6" />

    <!-- Top Section: Glowing Orange House inside Shield (Home Assets Protection) -->
    <g transform="translate(0, -75)" filter="url(#neonOrangeGlow)">
      <!-- Security Shield Contour -->
      <path d="M 0,-55 Q 48,-48 52,-20 C 52,22 24,46 0,55 C -24,46 -52,22 -52,-20 Q -48,-48 0,-55 Z" fill="#2d1303" fill-opacity="0.4" stroke="#f59e0b" stroke-width="3.5" />
      <path d="M 0,-47 Q 40,-41 43,-16 C 43,18 19,38 0,46 C -19,38 -43,18 -43,-16 Q -40,-41 0,-47 Z" fill="none" stroke="#fde047" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.8" />

      <!-- Glowing Neon House Icon -->
      <!-- Roof -->
      <path d="M 0,-24 L -24,0 L -18,0 L -18,20 L 18,20 L 18,0 L 24,0 Z" fill="none" stroke="#ffedd5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
      <!-- Chimney -->
      <line x1="12" y1="-14" x2="12" y2="-5" stroke="#ffedd5" stroke-width="2.5" />
      <!-- Window Grid -->
      <rect x="-8" y="2" width="16" height="12" rx="2" fill="none" stroke="#fde047" stroke-width="2" />
      <line x1="0" y1="2" x2="0" y2="14" stroke="#fde047" stroke-width="1.5" />
      <line x1="-8" y1="8" x2="8" y2="8" stroke="#fde047" stroke-width="1.5" />
    </g>

    <!-- Center Section: Glowing Holographic Futuristic Cyan Car (Vehicle Fleet & Maintenance) -->
    <g transform="translate(0, 45)" filter="url(#neonCyanGlow)">
      <!-- Car Body Outline -->
      <path d="M -60,18 C -58,6 -42,-4 -28,-14 C -16,-22 18,-22 35,-12 C 50,-3 62,6 64,18 L 62,24 C 62,26 58,28 50,28 L -48,28 C -56,28 -60,26 -60,24 Z" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linejoin="round" />
      
      <!-- Car Cockpit & Windshield -->
      <path d="M -22,-12 C -12,-18 14,-18 26,-10 L 32,-1 L -32,-1 Z" fill="#0c4a6e" fill-opacity="0.6" stroke="#e0f2fe" stroke-width="2" />
      
      <!-- Headlights & Aerodynamic Streaks -->
      <ellipse cx="-48" cy="18" rx="7" ry="4" fill="#67e8f9" />
      <ellipse cx="48" cy="18" rx="7" ry="4" fill="#67e8f9" />
      <line x1="-30" y1="8" x2="30" y2="8" stroke="#38bdf8" stroke-width="1.5" />
      
      <!-- Wheels with Cyan Glow -->
      <ellipse cx="-38" cy="28" rx="10" ry="14" fill="#041628" stroke="#00f2fe" stroke-width="2.5" />
      <ellipse cx="38" cy="28" rx="10" ry="14" fill="#041628" stroke="#00f2fe" stroke-width="2.5" />
      <ellipse cx="-38" cy="28" rx="4" ry="6" fill="#67e8f9" />
      <ellipse cx="38" cy="28" rx="4" ry="6" fill="#67e8f9" />
    </g>

    <!-- Bottom Section: "LIFE KEEP" Futuristic Metallic Neon Text -->
    <g transform="translate(0, 135)">
      <!-- Cyber Curved Label Banner -->
      <path d="M -75,0 Q 0,16 75,0 L 68,16 Q 0,28 -68,16 Z" fill="#030b17" stroke="#0284c7" stroke-width="1.5" />
      <text x="0" y="11" fill="#ffffff" font-family="'Arial Black', system-ui, sans-serif" font-weight="900" font-size="14" letter-spacing="3" text-anchor="middle" filter="url(#neonCyanGlow)">LIFE KEEP</text>
    </g>

    <!-- Glossy Glass Reflection Overlay Top Curved Dome -->
    <path d="M -120,-160 C -40,-230 40,-230 120,-160 C 90,-100 60,-50 -20,-30 C -80,-20 -110,-100 -120,-160 Z" fill="url(#specularGlint)" opacity="0.6" />

    <!-- Glass Specular Point Sparkle -->
    <circle cx="-60" cy="-150" r="4" fill="#ffffff" filter="url(#neonCyanGlow)" />
    <circle cx="80" cy="-100" r="3" fill="#ffffff" filter="url(#neonOrangeGlow)" />
  </g>
</svg>
