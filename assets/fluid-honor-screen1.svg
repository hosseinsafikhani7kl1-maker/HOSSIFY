<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fhDarkBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="30%" stop-color="#0b1020" />
      <stop offset="70%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1322" stop-opacity="0.95" />
    </linearGradient>

    <!-- Orange Gradient Button -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Device Background -->
  <rect width="380" height="780" rx="36" fill="url(#fhDarkBg1)" stroke="#1e293b" stroke-width="4" />

  <!-- Top App Header -->
  <g transform="translate(18, 16)">
    <!-- Globe Icon (Language) -->
    <circle cx="20" cy="18" r="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="22" fill="#94a3b8" font-size="12" text-anchor="middle">🌐</text>
    <text x="20" y="36" fill="#64748b" font-family="'Vazirmatn', system-ui, sans-serif" font-size="8" text-anchor="middle">زبان</text>

    <!-- Center App Title -->
    <text x="172" y="24" fill="#ffffff" font-family="'Arial Black', system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="1.5" text-anchor="middle">FLUIDHONOR</text>

    <!-- Orange Pulse/Wave Icon Button -->
    <rect x="296" y="2" width="34" height="34" rx="10" fill="url(#orangeGrad)" />
    <path d="M 302,19 L 310,19 L 314,8 L 318,30 L 322,14 L 326,19 L 330,19" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Date Subtitle Header -->
  <g transform="translate(190, 84)">
    <text x="0" y="0" fill="#94a3b8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="11" text-anchor="middle">۱۴۰۲ مرداد ۱۳ - دوشنبه</text>
    <circle cx="0" cy="12" r="2" fill="#475569" />
  </g>

  <!-- Return to Dashboard Button -->
  <g transform="translate(180, 142)">
    <rect x="0" y="0" width="176" height="32" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <text x="88" y="20" fill="#94a3b8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="11" text-anchor="middle">بازگشت به داشبورد عیب‌یابی ➔</text>
  </g>

  <!-- Main Dark Content Card -->
  <g transform="translate(16, 202)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="348" height="490" rx="20" fill="url(#cardGrad1)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Card Header Titles -->
    <text x="328" y="38" fill="#ffffff" font-family="'Vazirmatn', system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="end">نمای کلی پمپ‌ها</text>
    <text x="328" y="56" fill="#64748b" font-family="'Vazirmatn', system-ui, sans-serif" font-size="10" text-anchor="end">p1 - 105</text>

    <!-- Technical Pumps Diagram Plate (White engineering sheet) -->
    <g transform="translate(16, 185)">
      <rect x="0" y="0" width="316" height="196" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

      <!-- Top Header Row of White Sheet -->
      <rect x="6" y="6" width="180" height="18" fill="#1e3a5f" rx="3" />
      <text x="96" y="19" fill="#ffffff" font-family="'Vazirmatn', system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">نمای کلی سیستم هیدرولیک پمپ لوله‌مغزی (مدار ۴ پورت)</text>

      <rect x="192" y="6" width="118" height="18" fill="#1e3a5f" rx="3" />
      <text x="251" y="19" fill="#ffffff" font-family="'Vazirmatn', system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">پمپ اصلی هیدرواستاتیک (انژکتور)</text>

      <!-- Row 1: Pump Cutaways and Real Units (Blue Pumps) -->
      <!-- Pump 1 (Left Front View) -->
      <g transform="translate(10, 30)">
        <rect x="0" y="0" width="56" height="48" rx="4" fill="#f8fafc" />
        <ellipse cx="28" cy="24" rx="22" ry="18" fill="#1e40af" stroke="#1d4ed8" stroke-width="1.5" />
        <circle cx="28" cy="24" r="10" fill="#64748b" />
        <rect x="2" y="20" width="10" height="8" fill="#0f172a" rx="2" />
        <rect x="0" y="50" width="56" height="10" fill="#0f172a" rx="2" />
        <text x="28" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="6" text-anchor="middle">Variable Pump</text>
      </g>

      <!-- Pump 2 (Front Flange View) -->
      <g transform="translate(72, 30)">
        <rect x="0" y="0" width="56" height="48" rx="4" fill="#f8fafc" />
        <circle cx="28" cy="24" r="20" fill="#1e40af" stroke="#1d4ed8" stroke-width="1.5" />
        <circle cx="28" cy="24" r="12" fill="#334155" />
        <circle cx="28" cy="24" r="6" fill="#94a3b8" />
        <rect x="0" y="50" width="56" height="10" fill="#0f172a" rx="2" />
        <text x="28" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="6" text-anchor="middle">Flange Mount</text>
      </g>

      <!-- Pump 3 (Side Port View) -->
      <g transform="translate(134, 30)">
        <rect x="0" y="0" width="56" height="48" rx="4" fill="#f8fafc" />
        <rect x="8" y="8" width="40" height="32" rx="4" fill="#1e40af" />
        <rect x="18" y="2" width="20" height="8" fill="#334155" />
        <rect x="0" y="50" width="56" height="10" fill="#0f172a" rx="2" />
        <text x="28" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="6" text-anchor="middle">Port Block</text>
      </g>

      <!-- Pump Cutaway Internal Section (Right) -->
      <g transform="translate(200, 30)">
        <rect x="0" y="0" width="108" height="60" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.5" />
        <!-- Cutaway Casing -->
        <path d="M 10,40 L 98,40 L 98,15 L 60,10 L 10,25 Z" fill="#1d4ed8" />
        <path d="M 20,38 L 90,38 L 90,20 L 60,16 L 20,28 Z" fill="#b91c1c" />
        <!-- Shaft & Pistons -->
        <rect x="2" y="26" width="24" height="8" rx="2" fill="#64748b" />
        <rect x="30" y="20" width="54" height="18" fill="#cbd5e1" stroke="#475569" stroke-width="0.5" />
        <line x1="38" y1="20" x2="38" y2="38" stroke="#1e293b" stroke-width="1" />
        <line x1="48" y1="20" x2="48" y2="38" stroke="#1e293b" stroke-width="1" />
        <line x1="58" y1="20" x2="58" y2="38" stroke="#1e293b" stroke-width="1" />
        <line x1="68" y1="20" x2="68" y2="38" stroke="#1e293b" stroke-width="1" />
      </g>

      <!-- Row 2: Detailed Cross-Sections & Schematic Symbol -->
      <!-- Cross section left -->
      <g transform="translate(10, 104)">
        <rect x="0" y="0" width="118" height="82" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5" />
        <text x="6" y="10" fill="#1e3a5f" font-family="'Vazirmatn', system-ui, sans-serif" font-size="7" font-weight="700">۱. محفظه پیستون و سواش‌پلیت</text>
        <circle cx="59" cy="48" r="28" fill="#1e40af" />
        <circle cx="59" cy="48" r="20" fill="#b91c1c" />
        <circle cx="59" cy="48" r="10" fill="#e2e8f0" />
      </g>

      <!-- Hydraulic Schematic Symbol (Center) -->
      <g transform="translate(134, 104)">
        <rect x="0" y="0" width="56" height="82" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
        <text x="28" y="10" fill="#64748b" font-family="'Vazirmatn', system-ui, sans-serif" font-size="6" text-anchor="middle">شماتیک هیدرولیک</text>
        <!-- ISO Hydraulic Pump Symbol -->
        <circle cx="28" cy="42" r="16" fill="none" stroke="#0f172a" stroke-width="1.5" />
        <polygon points="28,26 22,38 34,38" fill="#0f172a" />
        <line x1="28" y1="26" x2="28" y2="16" stroke="#0f172a" stroke-width="1.5" />
        <line x1="28" y1="58" x2="28" y2="68" stroke="#0f172a" stroke-width="1.5" />
        <!-- Variable Arrow -->
        <line x1="14" y1="56" x2="42" y2="28" stroke="#0f172a" stroke-width="1.5" />
        <polygon points="42,28 36,30 40,34" fill="#0f172a" />
      </g>

      <!-- Cross section right -->
      <g transform="translate(196, 104)">
        <rect x="0" y="0" width="112" height="82" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5" />
        <text x="6" y="10" fill="#1e3a5f" font-family="'Vazirmatn', system-ui, sans-serif" font-size="7" font-weight="700">۲. مکانیزم شفت و پیستون محوری</text>
        <ellipse cx="56" cy="48" rx="36" ry="24" fill="#1e40af" />
        <ellipse cx="56" cy="48" rx="26" ry="16" fill="#b91c1c" />
        <rect x="4" y="44" width="22" height="8" rx="2" fill="#64748b" />
      </g>
    </g>

    <!-- Side Number Selector Indicators (1, 2, 3, 4) -->
    <g transform="translate(20, 290)">
      <!-- 4 -->
      <rect x="0" y="0" width="40" height="38" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="800" font-size="14" text-anchor="middle">4</text>

      <!-- 3 -->
      <rect x="0" y="46" width="40" height="38" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="800" font-size="14" text-anchor="middle">3</text>

      <!-- 2 -->
      <rect x="0" y="92" width="40" height="38" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="116" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="800" font-size="14" text-anchor="middle">2</text>

      <!-- 1 (Active Orange) -->
      <rect x="-4" y="134" width="48" height="42" rx="14" fill="url(#orangeGrad)" />
      <text x="20" y="161" fill="#000000" font-family="system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle">1</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(10, 715)">
    <rect width="360" height="54" rx="20" fill="#0c1220" stroke="#1e293b" stroke-width="1" />

    <!-- Theme Sun/Moon -->
    <g transform="translate(24, 27)">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#64748b" stroke-width="1.5" />
      <line x1="-12" y1="0" x2="-9" y2="0" stroke="#64748b" stroke-width="1.5" />
      <line x1="9" y1="0" x2="12" y2="0" stroke="#64748b" stroke-width="1.5" />
      <line x1="0" y1="-12" x2="0" y2="-9" stroke="#64748b" stroke-width="1.5" />
      <line x1="0" y1="9" x2="0" y2="12" stroke="#64748b" stroke-width="1.5" />
    </g>

    <!-- Help/Question -->
    <g transform="translate(74, 27)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="0" y="4" fill="#64748b" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">?</text>
    </g>

    <!-- Document -->
    <g transform="translate(122, 27)">
      <rect x="-8" y="-9" width="16" height="18" rx="2" fill="none" stroke="#64748b" stroke-width="1.5" />
      <line x1="-4" y1="-4" x2="4" y2="-4" stroke="#64748b" stroke-width="1.5" />
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#64748b" stroke-width="1.5" />
      <line x1="-4" y1="4" x2="2" y2="4" stroke="#64748b" stroke-width="1.5" />
    </g>

    <!-- Camera/Photo Gallery (Active Tab) -->
    <g transform="translate(168, 14)">
      <rect x="-18" y="-4" width="36" height="34" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <circle cx="0" cy="13" r="5" fill="none" stroke="#f59e0b" stroke-width="2" />
      <rect x="-10" y="5" width="20" height="16" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    </g>

    <!-- Bar Chart -->
    <g transform="translate(216, 27)">
      <rect x="-6" y="-2" width="3" height="10" fill="#64748b" />
      <rect x="-1" y="-8" width="3" height="16" fill="#64748b" />
      <rect x="4" y="-5" width="3" height="13" fill="#64748b" />
    </g>

    <!-- Reload/Cycle -->
    <g transform="translate(260, 27)">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="14 6" />
    </g>

    <!-- Gauge/Speedometer -->
    <g transform="translate(304, 27)">
      <path d="M -8,4 A 9 9 0 1 1 8,4" fill="none" stroke="#64748b" stroke-width="1.5" />
      <line x1="0" y1="4" x2="4" y2="-2" stroke="#64748b" stroke-width="1.5" />
    </g>

    <!-- Chevron/Terminal -->
    <g transform="translate(342, 27)">
      <path d="M -4,-5 L 2,0 L -4,5" fill="none" stroke="#64748b" stroke-width="1.5" />
    </g>
  </g>
</svg>
