<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Blue-Black Background Gradient -->
    <radialGradient id="ctBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0c192e" />
      <stop offset="45%" stop-color="#060e1a" />
      <stop offset="85%" stop-color="#02060c" />
      <stop offset="100%" stop-color="#010307" />
    </radialGradient>

    <!-- Metallic Pipe 3D Gradients -->
    <linearGradient id="metalPipe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="18%" stop-color="#cbd5e1" />
      <stop offset="45%" stop-color="#64748b" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="90%" stop-color="#475569" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="metalPipeBend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="60%" stop-color="#334155" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Orange/Red Glowing Fatigue Hotspot on Bend -->
    <linearGradient id="heatGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="80%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <radialGradient id="orangeRadialHeat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a00" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Chrome CT Letters Gradient -->
    <linearGradient id="chromeText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="55%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Graph Area Cyan Glow Gradient -->
    <linearGradient id="graphFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Gauge Outer Ring Gradient -->
    <linearGradient id="gaugeBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neonCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="hotGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle Background with Soft Blue Rim -->
  <rect width="512" height="512" rx="100" fill="url(#ctBg)" stroke="#1e3a5f" stroke-width="4" stroke-opacity="0.8" />
  <rect x="4" y="4" width="504" height="504" rx="96" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Background Glowing Data Chart Curve -->
  <g filter="url(#neonCyan)">
    <!-- Shaded Fill Area under Chart Curve -->
    <path d="M 155,335 C 205,330 245,315 295,280 C 345,245 385,200 415,165 L 415,335 Z" fill="url(#graphFill)" opacity="0.8" />
    
    <!-- Neon Chart Trend Line -->
    <path d="M 145,338 C 205,330 245,315 295,280 C 345,245 385,200 415,165" fill="none" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Neon Data Points on Curve -->
    <circle cx="145" cy="338" r="5.5" fill="#00e5ff" />
    <circle cx="200" cy="325" r="5.5" fill="#00e5ff" />
    <circle cx="300" cy="288" r="6" fill="#00e5ff" />
    <circle cx="355" cy="235" r="6" fill="#00e5ff" />
    <circle cx="415" cy="165" r="7.5" fill="#ffffff" stroke="#00e5ff" stroke-width="2.5" />
  </g>

  <!-- 3D Metallic Coiled Tubing S-Pipe Structure -->
  <g filter="url(#subtleDropShadow)">
    
    <!-- Tubing Pipe Shadow Behind -->
    <path d="M 495,115 C 440,115 395,115 375,130 C 345,155 350,210 325,240 C 290,285 240,295 190,295 C 100,295 70,225 70,165 C 70,85 140,55 240,55 C 290,55 340,80 340,115"
          fill="none" stroke="#000000" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" transform="translate(0, 10)" />

    <!-- Outer Main Metal Pipe Body -->
    <path d="M 500,105 C 440,105 390,105 370,120 C 335,145 340,205 315,235 C 280,280 230,290 185,290 C 100,290 65,225 65,165 C 65,85 135,55 235,55 C 290,55 335,80 335,115"
          fill="none" stroke="url(#metalPipeBend)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pipe Specular Highlight Core Line -->
    <path d="M 500,100 C 440,100 390,100 370,115 C 335,140 340,200 315,230 C 280,275 230,285 185,285 C 105,285 70,225 70,165 C 70,90 135,60 235,60 C 285,60 330,82 330,115"
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.75" />

    <!-- Pipe Inner Shadow Crease Line -->
    <path d="M 500,110 C 440,110 390,110 370,125 C 335,150 340,210 315,240 C 280,285 230,295 185,295 C 95,295 60,225 60,165 C 60,80 135,50 235,50 C 295,50 340,78 340,115"
          fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" opacity="0.8" />

    <!-- Open Cut Pipe Ends Metallic Rims -->
    <ellipse cx="305" cy="385" rx="18" ry="12" fill="#334155" stroke="#cbd5e1" stroke-width="3" transform="rotate(-30 305 385)" />
    <ellipse cx="305" cy="385" rx="11" ry="7" fill="#020617" transform="rotate(-30 305 385)" />

    <!-- Glowing Orange-Red Fatigue Stress Zone (The Cooled Neck Bend Area) -->
    <!-- Radial Glow Field -->
    <circle cx="325" cy="180" r="45" fill="url(#orangeRadialHeat)" filter="url(#hotGlowFilter)" />

    <!-- Pipe Section Glow at Bend Point -->
    <path d="M 355,140 C 335,165 335,195 305,225" fill="none" stroke="url(#heatGlow)" stroke-width="44" stroke-linecap="round" filter="url(#neonCyan)" />
    
    <!-- Intense White-Hot Core Stress Micro-Cracks Ring Lines -->
    <g stroke="#ffffff" stroke-width="3" opacity="0.9" stroke-linecap="round">
      <path d="M 345,150 C 335,160 330,170 325,185" />
      <path d="M 335,165 C 325,175 320,185 315,200" />
      <path d="M 325,180 C 315,190 310,200 305,215" />
    </g>
  </g>

  <!-- Chrome "CT" Text in Top-Left (Bold, Italic, 3D Chamfer) -->
  <g filter="url(#subtleDropShadow)" transform="translate(45, 125)">
    <!-- CT Shadow -->
    <text x="3" y="3" font-family="'Impact', 'Arial Black', system-ui, sans-serif" font-weight="900" font-style="italic" font-size="96" fill="#000000" letter-spacing="-2">CT</text>
    <!-- CT Chrome Main Face -->
    <text x="0" y="0" font-family="'Impact', 'Arial Black', system-ui, sans-serif" font-weight="900" font-style="italic" font-size="96" fill="url(#chromeText)" stroke="#475569" stroke-width="2" letter-spacing="-2">CT</text>
  </g>

  <!-- Bottom-Right Circular HUD Gauge -->
  <g transform="translate(390, 360)" filter="url(#subtleDropShadow)">
    <!-- Outer Heavy Metallic Dial Bezel -->
    <circle cx="0" cy="0" r="74" fill="#0b1322" stroke="url(#gaugeBezel)" stroke-width="12" />
    <circle cx="0" cy="0" r="67" fill="#020617" stroke="#1e293b" stroke-width="3" />
    
    <!-- Colored Arc (Green -> Yellow -> Red) -->
    <!-- Green Zone (0 to 60%) -->
    <path d="M -44,18 A 48,48 0 0,1 -18,-44" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round" filter="url(#neonCyan)" />
    <!-- Yellow Zone (60% to 80%) -->
    <path d="M -15,-45 A 48,48 0 0,1 25,-40" fill="none" stroke="#eab308" stroke-width="12" />
    <!-- Red Warning Zone (80% to 100%) -->
    <path d="M 28,-38 A 48,48 0 0,1 46,12" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" />

    <!-- Center Pivot & Gauge Needle (Pointing to ~68% Green/Yellow border) -->
    <!-- White Needle -->
    <g transform="rotate(35)">
      <polygon points="-4,6 4,6 1.5,-45 -1.5,-45" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
      <polygon points="-1,6 1,6 0.5,-45 -0.5,-45" fill="#ef4444" />
    </g>
    <!-- Center Cap Ring -->
    <circle cx="0" cy="0" r="12" fill="#1e293b" stroke="#64748b" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#f8fafc" />

    <!-- Percentage Digital Label "68%" -->
    <text x="0" y="38" fill="#4ade80" font-family="'Consolas', 'Courier New', monospace, sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="1">68%</text>
  </g>

  <!-- Bottom Tracked Neon Text "F A T I G U E" -->
  <g transform="translate(256, 470)">
    <text x="0" y="0" text-anchor="middle" fill="#00d2ff" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="10" filter="url(#neonCyan)">FATIGUE</text>
  </g>
</svg>
